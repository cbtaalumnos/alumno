function leerAsistencia(e){
  const f = e.target.files[0];
  if(!f) return;
  asistArchivo = f.name;
  recado('#recadoAsist','Leyendo el archivo…','ojo');
  $('#previaAsist').innerHTML = '';

  const lector = new FileReader();
  lector.onload = () => {
    try {
      const buffer = lector.result;
      const primeros = new Uint8Array(buffer.slice(0, 4));
      let matriz;

      if(primeros[0] === 0x50 && primeros[1] === 0x4B){
        const libro = XLSX.read(new Uint8Array(buffer), {type:'array'});
        matriz = XLSX.utils.sheet_to_json(libro.Sheets[libro.SheetNames[0]],
                                          {header:1, defval:'', raw:true, blankrows:false});
      } else {
        matriz = matrizDesdeCSV(decodificarHibrido(buffer));
      }
      armarAsistencia(matriz);
    } catch(err){
      recado('#recadoAsist','No se pudo leer el archivo: ' + err.message);
    }
  };
  lector.onerror = () => recado('#recadoAsist','No se pudo abrir el archivo.');
  lector.readAsArrayBuffer(f);
}

function matrizDesdeCSV(texto){
  const limpio = texto.replace(/^\uFEFF/, '');
  const lineas = limpio.split(/\r?\n/).filter(l => l.trim());
  const sep = lineas[0].includes('\t') ? '\t' : (lineas[0].includes(';') ? ';' : ',');
  return lineas.map(linea => {
    const salida = []; let actual = '', comillas = false;
    for(let i = 0; i < linea.length; i++){
      const c = linea[i];
      if(c === '"'){
        if(comillas && linea[i+1] === '"'){ actual += '"'; i++; }
        else comillas = !comillas;
      } else if(c === sep && !comillas){ salida.push(actual); actual = ''; }
      else actual += c;
    }
    salida.push(actual);
    return salida;
  });
}

function armarAsistencia(matriz){
  if(!matriz || matriz.length < 2) throw new Error('El archivo viene vacío.');

  const enc = matriz[0].map(c => normTxt(c));
  const iID = enc.indexOf('ID'), iNom = enc.indexOf('NOMBRE');
  const iFec = enc.indexOf('FECHA'), iEst = enc.indexOf('ESTADO');
  const iHora = enc.indexOf('HORA'), iReg = enc.indexOf('REGISTRO');

  const faltan = [];
  if(iID < 0)  faltan.push('ID');
  if(iFec < 0) faltan.push('Fecha');
  if(iEst < 0) faltan.push('Estado');
  if(faltan.length){
    recado('#recadoAsist','Al archivo le faltan estas columnas: ' + faltan.join(', '));
    return;
  }

  const filas = [], desconocidos = [], fechas = new Set();

  for(let i = 1; i < matriz.length; i++){
    const c = matriz[i];
    if(!c) continue;
    const id = limpia(c[iID]);
    if(!id) continue;

    const estadoTxt = normTxt(c[iEst]);
    if(!estadoTxt || estadoTxt === 'PRESENTE' || estadoTxt === 'ASISTIO') continue;

    const mapeo = ESTADOS_ASIST[estadoTxt];
    if(!mapeo){ desconocidos.push(limpia(c[iEst])); continue; }

    const f = limpia(c[iFec]).slice(0,10);
    if(f) fechas.add(f);

    // La hora puede venir como texto (08:15) o como fracción de día de Excel
    let hora = iHora >= 0 ? limpia(c[iHora]) : '';
    if(hora && /^0?\.\d+$/.test(hora)){
      const m = Math.round(parseFloat(hora) * 24 * 60);
      hora = String(Math.floor(m/60)).padStart(2,'0') + ':' + String(m%60).padStart(2,'0');
    }
    if(hora && !/^\d{1,2}:\d{2}/.test(hora)) hora = '';

    filas.push({
      id,
      nombre: iNom >= 0 ? limpia(c[iNom]) : '',
      hora: hora ? hora.slice(0,5) : null,
      registro: iReg >= 0 ? (limpia(c[iReg]) || null) : null,
      ...mapeo
    });
  }

  if(!filas.length){ recado('#recadoAsist','No se encontró ninguna inasistencia en el archivo.'); return; }
  if(fechas.size > 1){
    recado('#recadoAsist','El archivo tiene varias fechas: ' + [...fechas].join(', ')
      + '. Sube un archivo por día.');
    return;
  }

  asistLeida = filas;
  asistFecha = [...fechas][0] || '';
  recado('#recadoAsist','');
  previaAsistencia(filas, [...new Set(desconocidos)]);
}

function previaAsistencia(filas, desconocidos){
  const cuenta = {};
  filas.forEach(f => {
    const k = f.tipo === 'JUSTIFICADA' ? `Justificada (${f.motivo.toLowerCase()})`
            : f.tipo === 'RETARDO' ? 'Retardo' : 'Falta';
    cuenta[k] = (cuenta[k] || 0) + 1;
  });

  $('#previaAsist').innerHTML = `
    <div class="medidores" style="margin-top:20px">
      <div class="medidor"><div class="r">Fecha</div>
        <div class="v" style="font-size:19px">${fecha(asistFecha)}</div></div>
      <div class="medidor alerta"><div class="r">Inasistencias</div>
        <div class="v">${filas.length}</div></div>
      ${Object.entries(cuenta).map(([k,n]) =>
        `<div class="medidor"><div class="r">${escapar(k)}</div><div class="v">${n}</div></div>`).join('')}
    </div>

    ${desconocidos.length ? `<div class="recado ojo" style="margin-top:16px">
      No se reconocieron estos estados y se omitirán:
      <b>${escapar(desconocidos.join(' · '))}</b></div>` : ''}

    <div class="recado ojo" style="margin-top:16px">
      Si ya habías cargado el ${fecha(asistFecha)}, se reemplaza por completo.
      Así una falta que después se justificó queda corregida.
    </div>

    <div style="margin-top:20px;display:flex;gap:10px;flex-wrap:wrap">
      <button class="boton" id="btnGuardarAsist">Guardar ${filas.length} inasistencias</button>
      <button class="boton tenue" id="btnCancelarAsist">Cancelar</button>
    </div>
    <div id="resultadoAsist"></div>`;

  $('#btnCancelarAsist').addEventListener('click', () => irA('asistencia'));
  $('#btnGuardarAsist').addEventListener('click', async ev => {
    ev.target.disabled = true; ev.target.textContent = 'Guardando…';
    const r = await api('importar_asistencia', {
      fecha: asistFecha, archivo: asistArchivo, filas: asistLeida, reemplazar: true});
    ev.target.disabled = false; ev.target.textContent = `Guardar ${asistLeida.length} inasistencias`;

    if(!r.ok){ recado('#resultadoAsist', r.error); return; }

    $('#resultadoAsist').innerHTML = `
      <div class="recado bien" style="margin-top:16px">
        Se guardaron ${r.guardadas} inasistencias del ${fecha(r.fecha)}.
      </div>
      ${r.total_no_encontrados ? `
        <div class="recado ojo" style="margin-top:10px">
          ${r.total_no_encontrados} no se pudieron enlazar con ningún alumno:
          <br>${escapar(r.no_encontrados.join(' · '))}
        </div>` : ''}`;
    setTimeout(() => irA('asistencia'), 2200);
  });
}

/* ==========================================================================
   RESPALDO DE DATOS

   Todo se arma en el navegador. Los documentos se piden por tandas de 15
   porque son pesados; pedirlos todos de golpe excedería el límite de la
   petición y agotaría la memoria.

function nombreArchivoSeguro(t){
  return String(t ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^A-Za-z0-9 _.-]/g,'').replace(/\s+/g,'_').slice(0,70);
}

      return;

        Math.max(1, Math.round(indiceDocs.length/15))} ${
        Math.max(1, Math.round(indiceDocs.length/15)) === 1 ? 'segundo' : 'segundos'}.`,

  });

  $('#btnRespDocs').addEventListener('click', async ev => {
    if(!indiceDocs || !indiceDocs.length) return;
    ev.target.disabled = true;
    const zip = new JSZip();
    const lista = [];

    try {
      for(let i = 0; i < indiceDocs.length; i += 15){
        const tanda = indiceDocs.slice(i, i + 15);
        $('#progresoDocs').innerHTML =
          `<div class="recado ojo" style="margin-top:14px">Descargando ${
            Math.min(i+15, indiceDocs.length)} de ${indiceDocs.length}…</div>`;

        const r = await api('respaldo_archivos', {ids: tanda.map(d => d.id)});
        if(!r.ok) throw new Error(r.error);

        // Storage entrega enlaces firmados: cada archivo se baja directo,
        // sin pasar por la Edge Function.
        const mapa = new Map();
        for(const a of r.archivos){
          if(!a.url) continue;
          try {
            const resp = await fetch(a.url);
            if(resp.ok) mapa.set(a.id, await resp.blob());
          } catch(e){ /* se omite este archivo y sigue con los demás */ }
        }

        for(const d of tanda){
          const data = mapa.get(d.id);
          if(!data) continue;
          const a = d.alumnos || {};
          const g = a.grupos ? `${a.grupos.semestre}${a.grupos.letra}` : 'SIN_GRUPO';
          const quien = nombreArchivoSeguro(
            `${a.matricula}_${a.apellido_paterno} ${a.apellido_materno ?? ''} ${a.nombres}`);
          const doc = nombreArchivoSeguro(d.documentos_catalogo?.nombre ?? 'documento');
          const ext = data.type === 'application/pdf' ? 'pdf' : 'jpg';
          zip.file(`${g}/${quien}__${doc}.${ext}`, data);

          lista.push({
            grupo: g, matricula: a.matricula,
            alumno: `${a.apellido_paterno ?? ''} ${a.apellido_materno ?? ''} ${a.nombres ?? ''}`.trim(),
            documento: d.documentos_catalogo?.nombre ?? '',
            estado: d.estado, peso_kb: d.peso_kb ?? '', subido_en: d.subido_en ?? ''
          });
        }
      }

      // Lista de contenido dentro del propio ZIP
      const cols = ['grupo','matricula','alumno','documento','estado','peso_kb','subido_en'];
      const csv = 'sep=;\r\n' + [cols.join(';')].concat(lista.map(f =>
        cols.map(c => {
          const v = String(f[c] ?? '');
          return /[",;\n]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v;
        }).join(';'))).join('\r\n');
      zip.file('_contenido.csv', '\uFEFF' + csv);

      $('#progresoDocs').innerHTML =
        '<div class="recado ojo" style="margin-top:14px">Comprimiendo…</div>';

      const blob = await zip.generateAsync({type:'blob', compression:'DEFLATE'});
      const sel = $('#respGrupo');
      const etiqueta = sel.value ? nombreArchivoSeguro(sel.options[sel.selectedIndex].text) : 'todos';
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `documentos_${etiqueta}_${new Date().toISOString().slice(0,10)}.zip`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 8000);

      $('#progresoDocs').innerHTML =
        `<div class="recado bien" style="margin-top:14px">Listo: ${lista.length} documentos en el ZIP.</div>`;
    } catch(err){
      $('#progresoDocs').innerHTML =
        `<div class="recado mal" style="margin-top:14px">${escapar(err.message || 'Falló la descarga.')}</div>`;
    }
    ev.target.disabled = false;
  });
}


/* Muestra cuánto ocupan los documentos en Storage */
async function revisarMigracion(){
  const caja = $('#estadoMigracion');
  if(!caja) return;

  const r = await api('listar', {
    tabla:'v_espacio_documentos', columnas:'en_storage,total_mb', limite:1});
  const e = (r.ok && r.datos[0]) ? r.datos[0] : {};
  const mb = Number(e.total_mb || 0);
  const porc = Math.min(100, Math.round(mb / 1024 * 100));

  caja.className = '';
  caja.innerHTML = `<div class="recado ${porc > 70 ? 'ojo' : 'bien'}" style="margin-top:0">
    ${e.en_storage ?? 0} documentos en Storage · ${mb} MB · ${porc}% de 1 GB.
    La base de datos no carga ningún archivo.</div>`;
}

// Recorre una tabla completa en páginas de 1000
async function traerTodo(tabla, orden){
  const todo = [];
  for(let desde = 0; desde < 20000; desde += 1000){
    const r = await api('listar', {tabla, orden, limite:1000, desde});
    if(!r.ok) throw new Error(r.error);
    todo.push(...r.datos);
    if(r.datos.length < 1000) break;
  }
  return todo;
}

/* ==========================================================================
   CIERRE DE CICLO

   Cada año egresa una generación. Lo que ocupa espacio son los documentos
   escaneados, no los alumnos ni sus calificaciones, así que los tres modos
   liberan los archivos y se diferencian en qué tanto conservan del resto.
   ========================================================================== */

let cierreSeleccion = [];

async function verCierre(){
  const grupos = lookups.grupos || [];
  const conteo = await api('listar', {
    tabla:'alumnos', columnas:'id,grupo_id,estatus,activo', limite:2000});
  const alumnos = conteo.ok ? conteo.datos : [];

  const porGrupo = {};
  alumnos.forEach(a => {
    porGrupo[a.grupo_id] = porGrupo[a.grupo_id] || {total:0, egresados:0};
    porGrupo[a.grupo_id].total++;
    if(a.estatus === 'EGRESADO') porGrupo[a.grupo_id].egresados++;
  });

  cierreSeleccion = [];

  $('#vista').innerHTML = `
    <div class="recado ojo" style="margin-top:0">
      Esta pantalla modifica datos de forma permanente. Antes de usarla, descarga
      el respaldo desde la sección anterior.
    </div>

    <div class="tarjeta" style="margin-top:18px">
      <h3>1. Elige los grupos que salen</h3>
      <div class="cuerpo">
        ${grupos.length ? `
          <div class="tabla-marco"><table class="datos" style="min-width:0">
            <thead><tr><th style="width:44px"></th><th>Grupo</th><th>Carrera</th>
              <th class="n">Alumnos</th><th class="n">Ya egresados</th><th>Estado</th></tr></thead>
            <tbody>${grupos.map(g => {
              const c = porGrupo[g.id] || {total:0, egresados:0};
              return `<tr>
                <td><input type="checkbox" class="chkGrupo" value="${g.id}"></td>
                <td><b>${escapar(nombreGrupo(g))}</b></td>
                <td style="font-size:12.5px;color:var(--texto-suave)">${
                  escapar(etiquetaRef('carreras', g.carrera_id))}</td>
                <td class="n">${c.total}</td>
                <td class="n">${c.egresados || '—'}</td>
                <td>${g.activo ? '<span class="sello va">Activo</span>'
                               : '<span class="sello espera">Archivado</span>'}</td>
              </tr>`;
            }).join('')}</tbody>
          </table></div>`
          : '<div class="vacio"><p>No hay grupos registrados.</p></div>'}
        <button class="boton tenue" id="btnCalcCierre" style="margin-top:16px">Ver qué se afecta</button>
        <div id="avisoCierre"></div>
      </div>
    </div>

    <div id="zonaCierre"></div>`;

  $('#btnCalcCierre').addEventListener('click', async ev => {
    cierreSeleccion = $$('.chkGrupo').filter(c => c.checked).map(c => Number(c.value));
    if(!cierreSeleccion.length){
      recado('#avisoCierre','Selecciona al menos un grupo.');
      $('#zonaCierre').innerHTML = '';
      return;
    }
    ev.target.disabled = true; ev.target.textContent = 'Calculando…';
    const r = await api('resumen_cierre', {grupo_ids: cierreSeleccion});
    ev.target.disabled = false; ev.target.textContent = 'Ver qué se afecta';

    if(!r.ok){ recado('#avisoCierre', r.error); return; }
    recado('#avisoCierre','');
    mostrarOpcionesCierre(r);
  });
}

function mostrarOpcionesCierre(r){
  const mb = (r.espacio_kb/1024).toFixed(1);

  $('#zonaCierre').innerHTML = `
    <div class="medidores" style="margin-top:20px">
      <div class="medidor"><div class="r">Alumnos</div><div class="v">${r.alumnos}</div>
        <div class="n">${r.ya_egresados} ya estaban egresados</div></div>
      <div class="medidor bien"><div class="r">Espacio a liberar</div><div class="v">${mb} MB</div>
        <div class="n">${r.documentos} documentos</div></div>
      <div class="medidor"><div class="r">Calificaciones</div><div class="v">${r.calificaciones}</div></div>
      <div class="medidor"><div class="r">Reportes</div><div class="v">${r.reportes}</div></div>
    </div>

    <div class="tarjeta" style="margin-top:20px">
      <h3>2. Elige qué hacer</h3>
      <div class="cuerpo">

        <label style="display:block;border:1.5px solid var(--linea-fuerte);border-radius:10px;
                      padding:14px 16px;margin-bottom:12px;cursor:pointer">
          <input type="radio" name="modoCierre" value="ARCHIVAR" checked>
          <b style="margin-left:6px">Archivar la generación</b>
          <p style="font-size:13px;color:var(--texto-suave);margin:8px 0 0 24px;max-width:66ch">
            Marca a los alumnos como egresados, les quita el acceso al portal y borra
            sus documentos escaneados. <b>Conserva sus calificaciones y su expediente
            de datos</b> como historial. Es la opción recomendada al cierre de cada año.
          </p>
        </label>

        <label style="display:block;border:1.5px solid var(--linea-fuerte);border-radius:10px;
                      padding:14px 16px;margin-bottom:12px;cursor:pointer">
          <input type="radio" name="modoCierre" value="SOLO_DOCUMENTOS">
          <b style="margin-left:6px">Solo liberar espacio</b>
          <p style="font-size:13px;color:var(--texto-suave);margin:8px 0 0 24px;max-width:66ch">
            Borra los documentos escaneados pero deja a los alumnos activos y con
            acceso. Úsalo cuando ya validaste el expediente completo y tienes el
            respaldo guardado, pero la generación sigue estudiando.
          </p>
        </label>

        <label style="display:block;border:1.5px solid var(--rojo);border-radius:10px;
                      padding:14px 16px;cursor:pointer;background:#FDECEA">
          <input type="radio" name="modoCierre" value="ELIMINAR">
          <b style="margin-left:6px;color:#8A1D15">Eliminar todo rastro del grupo</b>
          <p style="font-size:13px;color:#8A1D15;margin:8px 0 0 24px;max-width:66ch">
            Borra alumnos, calificaciones, asistencias, reportes, documentos, el
            horario y el grupo mismo. <b>No se puede deshacer y no queda historial
            académico.</b> Úsalo solo con generaciones muy antiguas y con el respaldo
            descargado.
          </p>
        </label>

        <div class="campo" style="margin-top:18px;max-width:340px">
          <label for="txtConfirmo">Escribe CONFIRMO para habilitar el botón</label>
          <input id="txtConfirmo" placeholder="CONFIRMO" autocomplete="off">
        </div>

        <button class="boton peligro" id="btnEjecutarCierre" disabled>Ejecutar</button>
        <div id="resultadoCierre"></div>
      </div>
    </div>`;

  $('#txtConfirmo').addEventListener('input', e => {
    $('#btnEjecutarCierre').disabled = e.target.value.trim().toUpperCase() !== 'CONFIRMO';
  });

  $('#btnEjecutarCierre').addEventListener('click', async ev => {
    const modo = $$('input[name="modoCierre"]').find(x => x.checked)?.value;
    const textos = {
      ARCHIVAR: `Se archivarán ${r.alumnos} alumnos y se liberarán ${mb} MB. Sus calificaciones se conservan.`,
      SOLO_DOCUMENTOS: `Se borrarán ${r.documentos} documentos y se liberarán ${mb} MB. Los alumnos siguen activos.`,
      ELIMINAR: `Se ELIMINARÁN ${r.alumnos} alumnos con todo su historial. Esto no se puede deshacer.`
    };
    if(!confirm(textos[modo] + '\n\n¿Continuar?')) return;

    ev.target.disabled = true; ev.target.textContent = 'Procesando…';
    const res = await api('cerrar_ciclo', {
      grupo_ids: cierreSeleccion, modo, confirmacion:'CONFIRMO'});
    ev.target.disabled = false; ev.target.textContent = 'Ejecutar';

    if(!res.ok){ recado('#resultadoCierre', res.error); return; }

    $('#resultadoCierre').innerHTML = `
      <div class="recado bien" style="margin-top:16px">
        Listo. Se liberaron ${(res.resultado.espacio_kb/1024).toFixed(1)} MB
        de ${res.resultado.documentos} documentos${
          res.resultado.egresados ? `, y ${res.resultado.egresados} alumnos quedaron como egresados` : ''}${
          res.resultado.eliminados ? `, y se eliminaron ${res.resultado.eliminados} alumnos` : ''}.
      </div>`;
    await cargarLookups();
    setTimeout(() => irA('cierre'), 2500);
  });
}

function verClave(){
  $('#vista').innerHTML = `
    <div class="tarjeta" style="max-width:440px">
      <h3>Cambiar mi contraseña</h3>
      <div class="cuerpo">
        <div class="campo"><label for="pActual">Contraseña actual</label>
          <input id="pActual" type="password" autocomplete="current-password"></div>
        <div class="campo"><label for="pNueva">Contraseña nueva</label>
          <input id="pNueva" type="password" autocomplete="new-password"></div>
        <div class="campo"><label for="pRepite">Repite la nueva</label>
          <input id="pRepite" type="password" autocomplete="new-password">
          <p class="pista">Mínimo 10 caracteres.</p></div>
        <div id="recadoClave"></div>
        <button class="boton" id="btnClave" style="margin-top:16px">Guardar contraseña</button>
        <p class="aviso-nota">Al cambiarla se cerrará tu sesión y tendrás que entrar de nuevo.</p>
      </div>
    </div>`;

  $('#btnClave').addEventListener('click', async ev => {
    const actual = $('#pActual').value, nueva = $('#pNueva').value, rep = $('#pRepite').value;
    if(nueva !== rep){ recado('#recadoClave','Las contraseñas nuevas no coinciden.'); return; }
    ev.target.disabled = true; ev.target.textContent = 'Guardando…';
    const r = await llamar('auth', {accion:'cambiar_password_admin', token:sesion.token, actual, nueva});
    ev.target.disabled = false; ev.target.textContent = 'Guardar contraseña';
    if(!r.ok){ recado('#recadoClave', r.error); return; }
    recado('#recadoClave','Contraseña guardada. Vuelve a entrar con la nueva.','bien');
    setTimeout(() => {
      bolsa.tira('cbta291adm_token'); bolsa.tira('cbta291adm_admin'); location.reload();
    }, 1800);
  });
}

/* ==========================================================================
   ARRANQUE
   ========================================================================== */
(async function(){
  const t = bolsa.lee('cbta291adm_token');
  const a = bolsa.lee('cbta291adm_admin');
  if(!t || !a) return;
  const r = await llamar('auth', {accion:'validar', token:t});
  if(r.ok && r.tipo === 'ADMIN'){
    sesion.token = t; sesion.admin = JSON.parse(a);
    abrirPanel();
  } else {
    bolsa.tira('cbta291adm_token'); bolsa.tira('cbta291adm_admin');
  }
})();
</script>
