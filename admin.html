/* ==========================================================================
   PANEL DE ADMINISTRACIÓN — CBTA No. 291
   La configuración está al inicio del <script>.
   ========================================================================== */

:root{
  --verde:#1F7A3F; --verde-hondo:#123D22; --cian:#00A0B8;
  --rojo:#D93025; --ambar:#E8A33D; --azul:#2B4FA2;
  --papel:#F6F8F4; --linea:#DCE4DA; --linea-fuerte:#BFCCBB;
  --texto:#1A2B20; --texto-suave:#5C6E62;
  --radio:10px; --sombra:0 1px 2px rgba(18,61,34,.06), 0 8px 24px rgba(18,61,34,.06);
  --lateral:250px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Archivo',system-ui,-apple-system,sans-serif;background:var(--papel);
  color:var(--texto);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-weight:700;line-height:1.15;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
table{border-collapse:collapse;width:100%}
a{color:var(--verde)}
.oculto{display:none !important}

/* Acceso */
#acceso{min-height:100dvh;display:grid;place-items:center;padding:24px;
  background:radial-gradient(120% 80% at 50% 0%,#1c5c33 0%,var(--verde-hondo) 60%)}
.acceso-caja{background:var(--papel);border-radius:14px;padding:34px 32px;width:100%;
  max-width:400px;box-shadow:0 24px 60px rgba(0,0,0,.3)}
.acceso-caja img{width:74px;display:block;margin:0 auto 18px}
.acceso-caja h1{font-size:22px;text-align:center;font-variation-settings:'wdth' 108}
.acceso-caja .guia{text-align:center;color:var(--texto-suave);font-size:13.5px;margin-top:6px}

.campo{margin-top:16px}
.campo label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
.campo input,.campo select,.campo textarea{width:100%;padding:9px 12px;
  border:1.5px solid var(--linea-fuerte);border-radius:var(--radio);background:#fff;font-size:14.5px}
.campo textarea{min-height:90px;resize:vertical}
.campo input:focus,.campo select:focus,.campo textarea:focus{
  outline:2px solid var(--cian);outline-offset:1px;border-color:var(--cian)}
.campo .pista{margin-top:5px;font-size:12px;color:var(--texto-suave)}

.boton{display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:9px 17px;border:none;border-radius:var(--radio);background:var(--verde);
  color:#fff;font-weight:650;font-size:14px;cursor:pointer;transition:background .15s}
.boton:hover{background:#186331}
.boton:disabled{opacity:.55;cursor:progress}
.boton.ancho{width:100%;margin-top:20px;padding:12px}
.boton.tenue{background:#fff;color:var(--texto);border:1.5px solid var(--linea-fuerte)}
.boton.tenue:hover{background:#EEF3EC}
.boton.chico{padding:5px 11px;font-size:13px;border-radius:7px}
.boton.peligro{background:var(--rojo)}
.boton.peligro:hover{background:#B4261C}

.recado{margin-top:14px;padding:10px 13px;border-radius:var(--radio);font-size:13.5px;border-left:4px solid}
.recado.mal{background:#FDECEA;border-color:var(--rojo);color:#8A1D15}
.recado.bien{background:#E7F5EC;border-color:var(--verde);color:#12522B}
.recado.ojo{background:#FDF3E2;border-color:var(--ambar);color:#7A5312}

/* Estructura */
#panel{display:none;min-height:100dvh}
#panel.vivo{display:block}
.lateral{position:fixed;inset:0 auto 0 0;width:var(--lateral);background:var(--verde-hondo);
  color:#CFE3D5;display:flex;flex-direction:column;z-index:40}
.lateral-cabeza{padding:17px;display:flex;align-items:center;gap:11px;
  border-bottom:1px solid rgba(255,255,255,.12)}
.lateral-cabeza img{width:38px;height:38px;flex:none}
.lateral-cabeza .t{font-weight:800;color:#fff;font-size:14px;line-height:1.2}
.lateral-cabeza .s{font-size:11px;color:#8FB79B;margin-top:2px}
.menu{flex:1;overflow-y:auto;padding:12px 9px 18px}
.menu-grupo{padding:14px 9px 6px;font-size:10.5px;font-weight:700;color:#6E9A7C;letter-spacing:.06em}
.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;
  margin-bottom:2px;border:none;border-radius:7px;background:transparent;color:#CFE3D5;
  text-align:left;font-size:14px;cursor:pointer}
.menu button:hover{background:rgba(255,255,255,.07);color:#fff}
.menu button.activo{background:var(--verde);color:#fff;font-weight:600}
.menu button .ic{width:18px;text-align:center;opacity:.9}
.lateral-pie{padding:11px 13px;border-top:1px solid rgba(255,255,255,.12)}

.lienzo{margin-left:var(--lateral);min-height:100dvh}
.barra{position:sticky;top:0;z-index:30;background:rgba(246,248,244,.94);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--linea);padding:12px 26px;display:flex;align-items:center;gap:14px}
.barra h2{font-size:18px;font-variation-settings:'wdth' 108}
.barra .yo{margin-left:auto;text-align:right;line-height:1.25}
.barra .yo b{display:block;font-size:13px}
.barra .yo span{font-size:11.5px;color:var(--texto-suave)}
.hamburguesa{display:none;background:none;border:none;font-size:22px;cursor:pointer;padding:2px 5px}
.vista{padding:22px 26px 70px;max-width:1400px}

.tarjeta{background:#fff;border:1px solid var(--linea);border-radius:var(--radio);box-shadow:var(--sombra)}
.tarjeta > h3{padding:13px 17px;border-bottom:1px solid var(--linea);font-size:15px;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tarjeta > h3 .der{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.tarjeta > .cuerpo{padding:17px}

.medidores{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:13px}
.medidor{background:#fff;border:1px solid var(--linea);border-radius:var(--radio);padding:14px 16px}
.medidor .r{font-size:12px;color:var(--texto-suave)}
.medidor .v{font-size:28px;font-weight:800;line-height:1.1;margin-top:2px;font-variant-numeric:tabular-nums}
.medidor.alerta .v{color:var(--rojo)}
.medidor.bien .v{color:var(--verde)}

.tabla-marco{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.datos{font-size:13.5px;min-width:560px}
table.datos th{background:#EDF2EB;padding:8px 11px;text-align:left;font-size:12px;font-weight:700;
  color:#3C5145;border-bottom:1px solid var(--linea-fuerte);white-space:nowrap;position:sticky;top:0}
table.datos td{padding:7px 11px;border-bottom:1px solid var(--linea);vertical-align:middle}
table.datos tbody tr:hover{background:#F4F8F3}
table.datos td.n,table.datos th.n{text-align:center;font-variant-numeric:tabular-nums}
table.datos td.acciones{white-space:nowrap;text-align:right}
table.datos input.celda{width:58px;padding:4px 6px;border:1.5px solid var(--linea-fuerte);
  border-radius:6px;text-align:center;font-variant-numeric:tabular-nums}
table.datos input.celda:focus{outline:2px solid var(--cian);outline-offset:0;border-color:var(--cian)}

.sello{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:650;white-space:nowrap}
.sello.va{background:#E7F5EC;color:#15693A}
.sello.cae{background:#FDECEA;color:#A02318}
.sello.espera{background:#EEF1ED;color:#5C6E62}
.sello.ojo{background:#FDF3E2;color:#7A5312}
.sello.info{background:#E4F4F7;color:#0A6B7C}

.herramientas{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px}
.herramientas .campo{margin-top:0;min-width:180px}
.herramientas .campo.crece{flex:1;min-width:220px}

/* Ventana modal */
.ventana{display:none;position:fixed;inset:0;background:rgba(14,42,25,.5);z-index:60;
  padding:22px;overflow-y:auto}
.ventana.vivo{display:block}
.ventana-caja{background:var(--papel);border-radius:12px;max-width:720px;margin:24px auto;
  box-shadow:0 24px 70px rgba(0,0,0,.35)}
.ventana-caja > header{padding:16px 20px;border-bottom:1px solid var(--linea);
  display:flex;align-items:center;gap:14px}
.ventana-caja > header h3{font-size:17px}
.ventana-caja > header .cerrar{margin-left:auto;background:none;border:none;font-size:22px;
  cursor:pointer;color:var(--texto-suave);line-height:1}
.ventana-caja > .cuerpo{padding:20px}
.ventana-caja > footer{padding:14px 20px;border-top:1px solid var(--linea);
  display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.rejilla-campos{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.rejilla-campos .completo{grid-column:1 / -1}

.pares{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.par span{display:block;font-size:11.5px;color:var(--texto-suave)}
.par b{font-size:14px;font-weight:600;word-break:break-word}

.pestanas{display:flex;gap:4px;border-bottom:1px solid var(--linea);margin-bottom:16px;overflow-x:auto}
.pestanas button{padding:8px 14px;border:none;background:none;cursor:pointer;font-size:13.5px;
  color:var(--texto-suave);border-bottom:2.5px solid transparent;white-space:nowrap}
.pestanas button.activo{color:var(--verde);border-bottom-color:var(--verde);font-weight:650}

.vacio{text-align:center;padding:40px 18px;color:var(--texto-suave)}
.vacio .g{font-size:32px;opacity:.4}
.vacio p{margin-top:7px;font-size:14px}
.cargando{text-align:center;padding:40px;color:var(--texto-suave)}
.velo{display:none;position:fixed;inset:0;background:rgba(14,42,25,.45);z-index:35}
.velo.vivo{display:block}

.aviso-nota{font-size:12.5px;color:var(--texto-suave);max-width:70ch;margin-top:10px}

@media (max-width:900px){
  .lateral{transform:translateX(-100%);transition:transform .22s ease}
  .lateral.abierto{transform:translateX(0)}
  .lienzo{margin-left:0}
  .hamburguesa{display:block}
  .barra{padding:10px 15px}
  .vista{padding:16px 15px 80px}
  .rejilla-campos{grid-template-columns:1fr}
  .ventana{padding:0}
  .ventana-caja{margin:0;border-radius:0;min-height:100dvh}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>

<script>
/* ==========================================================================
   CONFIGURACIÓN
   ========================================================================== */
const SUPABASE_URL = 'https://rfyzwtiwegvcbvifqmum.supabase.co';
const LLAVE_PUBLICA = 'sb_publishable_VR2jqXFCWfIT2hmdKHRalg_AoE6cG2C';
/* ========================================================================== */

const DIAS = ['','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const TURNOS = {MATUTINO:'Matutino', VESPERTINO:'Vespertino'};

const bolsa = (() => {
  const mem = {}; let sirve = true;
  try{ sessionStorage.setItem('__a','1'); sessionStorage.removeItem('__a'); }catch(e){ sirve=false; }
  return {
    lee: k => sirve ? sessionStorage.getItem(k) : (mem[k] ?? null),
    pon: (k,v) => sirve ? sessionStorage.setItem(k,v) : (mem[k]=v),
    tira: k => sirve ? sessionStorage.removeItem(k) : delete mem[k]
  };
})();

let sesion = {token:null, admin:null};
let vistaActual = 'tablero';   // evita que un detector de otra vista se dispare
let lookups = {};   // catálogos cargados para los selectores

const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));

function escapar(t){
  return String(t ?? '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fecha(f){
  if(!f) return '—';
  const d = new Date(f + (String(f).length===10 ? 'T12:00:00' : ''));
  return isNaN(d) ? f : d.toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'numeric'});
}
function nota(v){ return (v===null||v===undefined||v==='') ? '—' : Number(v).toFixed(1); }
function recado(donde, texto, tipo='mal'){
  const el = $(donde); if(!el) return;
  el.innerHTML = texto ? `<div class="recado ${tipo}">${escapar(texto)}</div>` : '';
}

async function llamar(funcion, cuerpo){
  const r = await fetch(SUPABASE_URL + '/functions/v1/' + funcion, {
    method:'POST',
    headers:{'Content-Type':'application/json',
             'Authorization':'Bearer ' + LLAVE_PUBLICA,
             'apikey': LLAVE_PUBLICA},
    body: JSON.stringify(cuerpo)
  });
  let d; try{ d = await r.json(); }
  catch(e){ return {ok:false, error:'El servidor no respondió.'}; }
  if(r.status === 401 && sesion.token){
    bolsa.tira('cbta291adm_token'); bolsa.tira('cbta291adm_admin');
    alert('Tu sesión expiró. Vuelve a entrar.');
    location.reload();
  }
  return d;
}
const api = (accion, extra={}) => llamar('admin-api', {accion, token:sesion.token, ...extra});

/* ==========================================================================
   ACCESO
   ========================================================================== */
$('#btnEntrar').addEventListener('click', entrar);
$('#inPassword').addEventListener('keydown', e => { if(e.key==='Enter') entrar(); });
$('#inUsuario').addEventListener('keydown', e => { if(e.key==='Enter') $('#inPassword').focus(); });

async function entrar(){
  const usuario = $('#inUsuario').value.trim();
  const password = $('#inPassword').value;
  if(!usuario || !password){ recado('#recadoEntrar','Escribe usuario y contraseña.'); return; }

  const b = $('#btnEntrar'); b.disabled=true; b.textContent='Verificando…';
  recado('#recadoEntrar','');
  const r = await llamar('auth', {accion:'login_admin', usuario, password});
  b.disabled=false; b.textContent='Entrar';

  if(!r.ok){ recado('#recadoEntrar', r.error || 'No fue posible entrar.'); return; }

  sesion.token = r.token; sesion.admin = r.admin;

async function cargarLookups(){
  const tablas = ['carreras','docentes','materias','grupos','periodos','documentos_catalogo'];
  const res = await Promise.all(tablas.map(t => api('listar', {tabla:t, orden:'id', limite:2000})));
  // Se ordenan aquí para que todos los desplegables del panel salgan en orden.
  tablas.forEach((t,i) => lookups[t] = ordenar(t, res[i].ok ? res[i].datos : []));
}

function nombreGrupo(g){
  if(!g) return '—';
  return `${g.semestre}-${g.letra} (${g.turno==='MATUTINO'?'M.T.':'V.T.'})`;
}
function buscaEn(tabla, id){ return (lookups[tabla]||[]).find(x => x.id === id); }

/* ==========================================================================
   ORDENAMIENTO
   Se ordena en el navegador y no en la base de datos porque casi todos los
   criterios usan más de una columna, y porque así los desplegables salen
   ordenados igual que las tablas.
   ========================================================================== */

// Comparador en español: ignora acentos y mayúsculas, y entiende números.
const comparador = new Intl.Collator('es', {sensitivity:'base', numeric:true});
const cmp = (a,b) => comparador.compare(String(a ?? ''), String(b ?? ''));

// Si no se capturó el apellido paterno, se toma la segunda palabra del
// nombre completo, que en el formato "Maribel Sanguino García" es el
// primer apellido.
function claveApellido(d){
  if(d.apellido_paterno) return d.apellido_paterno;
  const partes = String(d.nombre_completo ?? '').trim().split(/\s+/);
  return partes.length >= 2 ? partes[1] : (partes[0] ?? '');
}

const ORDENES = {
  // Semestre, luego letra del grupo, luego turno
  grupos: (a,b) => (a.semestre - b.semestre) || cmp(a.letra, b.letra) || cmp(a.turno, b.turno),

  // Semestre, y dentro de cada semestre por nombre
  materias: (a,b) => (a.semestre - b.semestre) || cmp(a.nombre, b.nombre),

  // Primer apellido
  docentes: (a,b) => cmp(claveApellido(a), claveApellido(b)) || cmp(a.nombre_completo, b.nombre_completo),

  carreras: (a,b) => cmp(a.nombre, b.nombre),

  // El periodo más reciente hasta arriba
  periodos: (a,b) => cmp(b.clave, a.clave),

  documentos_catalogo: (a,b) => (a.orden - b.orden) || cmp(a.nombre, b.nombre),

  // Apellido paterno, materno y nombres
  alumnos: (a,b) => cmp(a.apellido_paterno, b.apellido_paterno)
                 || cmp(a.apellido_materno, b.apellido_materno)
                 || cmp(a.nombres, b.nombres),

  avisos: (a,b) => cmp(b.fecha_publica, a.fecha_publica)
};

function ordenar(tabla, filas){
  const f = ORDENES[tabla];
  return f ? [...(filas ?? [])].sort(f) : (filas ?? []);
}

// Ordena una lista de asignaciones (grupo_materia) por grupo y luego materia
function ordenarAsignaciones(filas){
  return [...(filas ?? [])].sort((a,b) => {
    const ga = buscaEn('grupos', a.grupo_id), gb = buscaEn('grupos', b.grupo_id);
    const porGrupo = ga && gb ? ORDENES.grupos(ga, gb) : 0;
    if(porGrupo) return porGrupo;
    return cmp(buscaEn('materias', a.materia_id)?.nombre, buscaEn('materias', b.materia_id)?.nombre);
  });
}

// Ordena asignaciones de un mismo grupo, solo por nombre de materia
function ordenarPorMateria(filas){
  return [...(filas ?? [])].sort((a,b) =>
    cmp(buscaEn('materias', a.materia_id)?.nombre, buscaEn('materias', b.materia_id)?.nombre));
}

async function irA(vista){
  vistaActual = vista;
  $$('#menu button').forEach(b => b.classList.toggle('activo', b.dataset.vista === vista));
  $('#tituloVista').textContent = TITULOS[vista] || '';
  $('#lateral').classList.remove('abierto'); $('#velo').classList.remove('vivo');
  // Se sustituye el contenedor por uno limpio. Sin esto, los detectores de
  // clic de las vistas anteriores siguen vivos y se disparan encima de la
  // vista actual, confundiendo los registros de una tabla con los de otra.
  const contenedorViejo = $('#vista');
  const contenedorNuevo = contenedorViejo.cloneNode(false);
  contenedorViejo.replaceWith(contenedorNuevo);

  $('#vista').innerHTML = '<div class="cargando">Cargando…</div>';
  window.scrollTo(0,0);
  try{
    if(vista==='tablero')             await verTablero();
    else if(vista==='alumnos')        await verAlumnos();
    else if(vista==='documentos')     await verDocumentos();
    else if(vista==='reportes')       await verReportes();
    else if(vista==='asignaciones')   await verAsignaciones();
    else if(vista==='horarios')       await verHorarios();
    else if(vista==='importar')       verImportar();
    else if(vista==='asistencia')     await verAsistencia();
    else if(vista==='respaldo')       await verRespaldo();
    else if(vista==='cierre')         await verCierre();
    else if(vista==='materias')       await verMaterias();
    else if(vista==='docentes')       await verDocentes();
    else if(vista==='avisos')         await verCatalogo('avisos');
    else if(vista==='clave')          verClave();
    else                              await verCatalogo(vista);

    $('#vista').innerHTML = `<div class="recado mal">No se pudieron cargar los datos: ${escapar(e.message||e)}</div>`;
  }
}

/* ==========================================================================
   EXPORTAR A CSV (se abre directo en Excel)
   ========================================================================== */
/* Exporta a Excel de verdad (.xlsx). Antes se generaba un CSV con punto y
   coma, y Excel lo abría en una sola columna cuando su separador de lista
   era la coma. Con .xlsx no hay separador que adivinar ni acentos que se
   rompan. Si por alguna razón la librería no cargó, cae a CSV. */
function exportarCSV(nombre, filas, columnas){
  if(!filas || !filas.length){ alert('No hay datos que exportar.'); return; }
  const cols = columnas || Object.keys(filas[0]);
  const hoy = new Date().toISOString().slice(0,10);

  const encabezado = cols.map(c =>
    c.replace(/_/g,' ').replace(/^./, m => m.toUpperCase()));

  const matriz = [encabezado].concat(filas.map(f => cols.map(c => {
    const v = f[c];
    if(v === null || v === undefined) return '';
    if(typeof v === 'boolean') return v ? 'Sí' : 'No';
    return v;
  })));

  if(typeof XLSX !== 'undefined'){
    const hoja = XLSX.utils.aoa_to_sheet(matriz);

    // Ancho de columna según el contenido, para que no salga todo aplastado
    hoja['!cols'] = cols.map((c,i) => ({
      wch: Math.min(48, Math.max(10, ...matriz.map(r => String(r[i] ?? '').length + 2)))
    }));

    const libro = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(libro, hoja, nombre.slice(0,28) || 'Datos');
    XLSX.writeFile(libro, `${nombre}_${hoy}.xlsx`);
    return;
  }

  // Respaldo en CSV. La primera línea le dice a Excel cuál es el separador.
  const esc = v => {
    const t = String(v ?? '');
    return /[",;\n]/.test(t) ? '"' + t.replace(/"/g,'""') + '"' : t;
  };
  const csv = 'sep=;\r\n' + matriz.map(r => r.map(esc).join(';')).join('\r\n');
  const blob = new Blob(['\uFEFF' + csv], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${nombre}_${hoy}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
}

function etiquetaRef(tabla, id){
  const x = buscaEn(tabla, id);
  if(!x) return '—';
  if(tabla==='grupos') return nombreGrupo(x);
  if(tabla==='docentes') return x.nombre_completo;
  if(tabla==='periodos') return x.clave;
  return x.nombre;
}

function celdaValor(campo, fila){
  const v = fila[campo.c];
  if(campo.tipo==='bool') return v ? '<span class="sello va">Sí</span>' : '<span class="sello espera">No</span>';
  if(campo.tipo==='ref'){
    // Sin referencia, se muestra la leyenda del campo en vez de un guion suelto
    if(!v) return `<span style="color:var(--texto-suave)">${escapar(campo.vacio ?? '—')}</span>`;
    return escapar(etiquetaRef(campo.tabla, v));
  }
  if(campo.tipo==='date') return v ? fecha(v) : '—';
  if(campo.tipo==='texto') return escapar(String(v ?? '').slice(0,70) + (String(v??'').length>70?'…':''));
  return escapar(v ?? '—');
}

          <button class="boton chico" id="btnNuevo">Agregar ${def.singular}</button>
        </span></h3>
      ${filas.length ? `
        <div class="tabla-marco">
          <table class="datos">
            <thead><tr><th style="width:40px"><input type="checkbox" id="chkTodos"></th>
              ${camposTabla.map(c => `<th>${escapar(c.r)}</th>`).join('')}<th></th></tr></thead>
            <tbody>${filas.map(f => `<tr data-id="${f.id}">
              <td><input type="checkbox" class="chkFila" value="${f.id}"></td>
              ${camposTabla.map(c => `<td>${celdaValor(c,f)}</td>`).join('')}

                <button class="boton tenue chico editar">Editar</button>

          </table>
        </div>`
        : `<div class="vacio"><div class="g">◈</div><p>Aún no hay ${TITULOS[tabla].toLowerCase()}. Agrega el primero con el botón de arriba.</p></div>`}
    </div>
    ${def.nota ? `<p class="aviso-nota">${escapar(def.nota)}</p>` : ''}`;

  $('#btnNuevo').addEventListener('click', () => formulario(tabla, null));
  $('#btnExp').addEventListener('click', () => exportarCSV(tabla, filas));

  const selFiltro = $('#fCat');
  if(selFiltro) selFiltro.addEventListener('change', e => {
    filtrosCatalogo[tabla] = e.target.value;
    irA(tabla);
  });

  // Nombre legible de cada registro, para mostrarlo antes de borrar
  const etiquetaDe = f => {
    const primero = camposTabla.find(c => c.tipo !== 'bool');
    return String(f[primero?.c] ?? f.nombre ?? f.titulo ?? ('registro ' + f.id));
  };

  const refrescarSeleccion = () => {
    const n = $$('.chkFila').filter(c => c.checked).length;
    const b = $('#btnBorrarSel');
    b.classList.toggle('oculto', n === 0);
    b.textContent = `Borrar ${n} seleccionado${n === 1 ? '' : 's'}`;
  };

  const todos = $('#chkTodos');
  if(todos) todos.addEventListener('change', e => {
    $$('.chkFila').forEach(c => c.checked = e.target.checked);
    refrescarSeleccion();
  });

  $('#vista').addEventListener('change', e => {
    if(vistaActual !== tabla) return;
    if(e.target.classList.contains('chkFila')) refrescarSeleccion();
  });

  $('#btnBorrarSel').addEventListener('click', () => {
    const ids = $$('.chkFila').filter(c => c.checked).map(c => Number(c.value));
    if(!ids.length) return;
    borrarDeCatalogo(tabla, ids, ids.map(id =>
      etiquetaDe(filas.find(f => f.id === id) || {})), def.singular);
  });

  $('#vista').addEventListener('click', async e => {
    if(vistaActual !== tabla) return;
    const tr = e.target.closest('tr[data-id]'); if(!tr) return;
    const id = Number(tr.dataset.id);

    if(e.target.classList.contains('editar')) formulario(tabla, fila);
    if(e.target.classList.contains('borrar')){
      borrarDeCatalogo(tabla, [id], [etiquetaDe(fila || {})], def.singular);
    }
  });
}

function campoHTML(campo, valor){
  const id = 'f_' + campo.c;
  const clase = campo.ancho === 'completo' ? 'campo completo' : 'campo';
  let control;

  if(campo.tipo === 'bool'){
    control = `<select id="${id}"><option value="true"${valor?' selected':''}>Sí</option>
               <option value="false"${!valor?' selected':''}>No</option></select>`;
  } else if(campo.tipo === 'select'){
    control = `<select id="${id}">${campo.opciones.map(o =>
      `<option value="${escapar(o)}"${String(valor)===o?' selected':''}>${escapar(o)}</option>`).join('')}</select>`;
  } else if(campo.tipo === 'ref'){
    const items = (lookups[campo.tabla]||[]);
    control = `<select id="${id}">
      <option value="">${escapar(campo.vacio || '— elegir —')}</option>
      ${items.map(x => `<option value="${x.id}"${valor===x.id?' selected':''}>${escapar(
        campo.tabla==='grupos' ? nombreGrupo(x) :
        campo.tabla==='docentes' ? x.nombre_completo :
        campo.tabla==='periodos' ? `${x.clave} — ${x.nombre}` :
        x.nombre)}</option>`).join('')}
    </select>`;
  } else if(campo.tipo === 'texto'){
    control = `<textarea id="${id}">${escapar(valor ?? '')}</textarea>`;
  } else {
    const t = campo.tipo==='numero' ? 'number' : (campo.tipo==='date' ? 'date' : (campo.tipo==='email'?'email':'text'));
    control = `<input id="${id}" type="${t}" value="${escapar(valor ?? '')}"${campo.ej?` placeholder="${escapar(campo.ej)}"`:''}>`;
  }
  return `<div class="${clase}"><label for="${id}">${escapar(campo.r)}${campo.req?' *':''}</label>${control}</div>`;
}

function formulario(tabla, fila){
  const def = CATALOGOS[tabla];
  const esNuevo = !fila;

  // Solo los avisos aceptan adjunto
  const bloqueAdjunto = tabla !== 'avisos' ? '' : `
    <div class="campo completo" style="border-top:1px solid var(--linea);padding-top:16px;margin-top:6px">
      <label for="avArchivo">Imagen o PDF adjunto</label>
      ${fila?.nombre_archivo ? `
        <p style="font-size:12.5px;color:var(--texto-suave);margin-bottom:8px">
          Actual: ${escapar(fila.nombre_archivo)} · ${fila.peso_kb ?? '?'} KB
          <button type="button" class="boton tenue chico" id="btnVerAdj" style="margin-left:8px">Ver</button>
          <button type="button" class="boton tenue chico" id="btnQuitarAdj">Quitar</button>
        </p>` : ''}
      <input id="avArchivo" type="file" accept="image/*,application/pdf" style="width:100%;font-size:13px">
      <p class="pista">Las imágenes se reducen solas. Los PDF admiten hasta 800 KB.</p>
      <div id="avisoAdj"></div>
    </div>`;

  const cuerpo = `<div class="rejilla-campos">
      ${def.campos.map(c => campoHTML(c, fila ? fila[c.c] : (c.tipo==='bool' ? true : ''))).join('')}
      ${bloqueAdjunto}
    </div><div id="recadoForm"></div>`;

  let quitarAdjunto = false;

  abrirVentana(
    (esNuevo ? 'Agregar ' : 'Editar ') + def.singular,
    cuerpo,
    [{texto:'Cancelar', clase:'tenue', accion:cerrarVentana},
     {texto:'Guardar', accion: async (ev) => {
        const registro = {};
        for(const c of def.campos){
          const el = document.getElementById('f_' + c.c);
          let v = el.value;
          if(c.tipo==='bool') v = (v === 'true');
          else if(v === '') v = null;
          else if(c.tipo==='numero' || c.tipo==='ref') v = Number(v);
          if(c.req && (v === null || v === '')){
            recado('#recadoForm', `Falta capturar: ${c.r}`); return;
          }
          registro[c.c] = v;
        }

        // Adjunto del aviso
        if(tabla === 'avisos'){
          if(quitarAdjunto){
            registro.archivo = null; registro.tipo_archivo = null;
            registro.nombre_archivo = null; registro.peso_kb = null;
          }
          const f = $('#avArchivo')?.files?.[0];
          if(f){
            try {
              const {dataUrl, tipo} = await prepararAdjunto(f);
              registro.archivo = dataUrl;
              registro.tipo_archivo = tipo;
              registro.nombre_archivo = f.name;
              registro.peso_kb = Math.round(dataUrl.length / 1024);
            } catch(err){ recado('#recadoForm', err.message); return; }
          }
        }

        ev.target.disabled = true; ev.target.textContent = 'Guardando…';
        const res = esNuevo
          ? await api('crear', {tabla, registro})
          : await api('actualizar', {tabla, id:fila.id, cambios:registro});
        ev.target.disabled = false; ev.target.textContent = 'Guardar';

        if(!res.ok){ recado('#recadoForm', res.error); return; }
        cerrarVentana();
        await cargarLookups();
        irA(tabla);
     }}]
  );

  const bVer = $('#btnVerAdj');
  if(bVer) bVer.addEventListener('click', async () => {
    const r = await api('aviso_archivo', {aviso_id: fila.id});
    if(!r.ok || !r.adjunto?.archivo){ alert('No se pudo abrir el adjunto.'); return; }
    abrirArchivo(r.adjunto.archivo, r.adjunto.nombre_archivo);
  });

  const bQuitar = $('#btnQuitarAdj');
  if(bQuitar) bQuitar.addEventListener('click', () => {
    quitarAdjunto = true;
    recado('#avisoAdj','El adjunto se quitará al guardar.','ojo');
  });
}

/* Comprime imágenes y valida el peso de los PDF antes de subirlos */
function prepararAdjunto(archivo){
  return new Promise((resolver, rechazar) => {
    if(archivo.type === 'application/pdf'){
      if(archivo.size > 800*1024){
        rechazar(new Error(`El PDF pesa ${Math.round(archivo.size/1024)} KB y el máximo son 800 KB.`));
        return;
      }
      const l = new FileReader();
      l.onload = () => resolver({dataUrl:l.result, tipo:'application/pdf'});
      l.onerror = () => rechazar(new Error('No se pudo abrir el archivo.'));
      l.readAsDataURL(archivo);
      return;
    }
    if(!archivo.type.startsWith('image/')){
      rechazar(new Error('Solo se aceptan imágenes o PDF.')); return;
    }
    const l = new FileReader();
    l.onload = () => {
      const img = new Image();
      img.onload = () => {
        const escala = Math.min(1, 1600 / img.width);
        const c = document.createElement('canvas');
        c.width = Math.round(img.width*escala); c.height = Math.round(img.height*escala);
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0,0,c.width,c.height);
        ctx.drawImage(img,0,0,c.width,c.height);
        let q = 0.85, out = c.toDataURL('image/jpeg', q);
        while(out.length > 900*1024 && q > 0.4){ q -= 0.1; out = c.toDataURL('image/jpeg', q); }
        resolver({dataUrl:out, tipo:'image/jpeg'});
      };
      img.onerror = () => rechazar(new Error('La imagen no es válida.'));
      img.src = l.result;
    };
    l.onerror = () => rechazar(new Error('No se pudo abrir el archivo.'));
    l.readAsDataURL(archivo);
  });
}

/* Abre un adjunto: las imágenes en una ventana, los PDF como descarga */
function abrirArchivo(dataUrl, nombre){
  if(String(dataUrl).startsWith('data:application/pdf')){
    const [, b64] = dataUrl.split(',');
    const bin = atob(b64); const bytes = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([bytes], {type:'application/pdf'}));
    window.open(url, '_blank');
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    return;
  }
  abrirVentana(nombre || 'Adjunto',
    `<img src="${dataUrl}" style="width:100%;border-radius:8px">`,
    [{texto:'Cerrar', clase:'tenue', accion:cerrarVentana}]);
}

// Tablas donde tiene sentido arrastrar lo que depende del registro
const ADMITE_CASCADA = new Set(['materias','docentes','carreras']);

function confirmarBorrado({titulo, aviso, elementos, tabla, ids, alBorrar}){
  const muestra = elementos.slice(0, 25);
  const resto = elementos.length - muestra.length;
  const puedeCascada = ADMITE_CASCADA.has(tabla);

  abrirVentana(titulo, `
    <div class="recado mal" style="margin-top:0">
      ${escapar(aviso)} <b>Esta acción no se puede deshacer.</b>
    </div>

    <p style="font-size:13.5px;margin-top:16px"><b>Se va a borrar:</b></p>
    <ul style="margin:8px 0 0 20px;font-size:13.5px;max-height:200px;overflow:auto">
      ${muestra.map(x => `<li>${escapar(x)}</li>`).join('')}
      ${resto > 0 ? `<li style="color:var(--texto-suave)">y ${resto} más…</li>` : ''}
    </ul>

    ${puedeCascada ? `
      <div style="margin-top:18px;border:1.5px solid var(--linea-fuerte);border-radius:10px;padding:14px 16px">
        <label style="cursor:pointer;display:block">
          <input type="checkbox" id="chkCascada">
          <b style="margin-left:6px">Borrar también lo que depende de estos registros</b>
        </label>
        <p style="font-size:13px;color:var(--texto-suave);margin:8px 0 0 24px">
          Sin esto, no se podrá borrar nada que tenga información asociada.
        </p>
        <div id="detalleDep"></div>
      </div>` : ''}

    <div class="campo" style="margin-top:20px;max-width:300px">
      <label for="txtBorrar">Escribe <b>BORRAR</b> para confirmar</label>
      <input id="txtBorrar" placeholder="BORRAR" autocomplete="off" spellcheck="false">
    </div>
    <div id="recadoBorrado"></div>`,
    [{texto:'Cancelar', clase:'tenue', accion:cerrarVentana},
     {texto:`Borrar ${elementos.length}`, clase:'peligro', accion: async ev => {
        if($('#txtBorrar').value.trim().toUpperCase() !== 'BORRAR'){
          recado('#recadoBorrado','Escribe la palabra BORRAR para continuar.');
          return;
        }
        ev.target.disabled = true; ev.target.textContent = 'Borrando…';
        await alBorrar(ev, !!$('#chkCascada')?.checked);
     }}]);

  setTimeout(() => $('#txtBorrar')?.focus(), 100);

  // Al marcar la casilla se consulta y se muestra qué se llevaría
  const chk = $('#chkCascada');
  if(chk) chk.addEventListener('change', async e => {
    const caja = $('#detalleDep');
    if(!e.target.checked){ caja.innerHTML = ''; return; }

    caja.innerHTML = '<div class="cargando" style="padding:10px">Calculando…</div>';
    const r = await api('dependencias', {tabla, ids});
    if(!r.ok){ caja.innerHTML = `<div class="recado mal">${escapar(r.error)}</div>`; return; }

    const lineas = Object.entries(r.cuenta).filter(([,n]) => n > 0);
    caja.innerHTML = lineas.length
      ? `<div class="recado mal" style="margin-top:12px">
           <b>Se borrarán además:</b>
           <ul style="margin:8px 0 0 18px">
             ${lineas.map(([k,n]) => `<li>${n} ${escapar(ETIQUETA_DEP[k] ?? k)}</li>`).join('')}

      : '<div class="recado bien" style="margin-top:12px">No hay nada asociado a estos registros.</div>';

/* Borra registros de un catálogo y reporta los que no se pudieron */
async function borrarDeCatalogo(tabla, ids, etiquetas, singular){
  confirmarBorrado({
    titulo: ids.length === 1 ? `Borrar ${singular}` : `Borrar ${ids.length} registros`,
    aviso: ids.length === 1
      ? `Vas a borrar este ${singular} del sistema.`
      : `Vas a borrar ${ids.length} registros del sistema.`,
    elementos: etiquetas,
    tabla, ids,
    alBorrar: async (ev, cascada) => {
      const r = await api('eliminar_lote', {tabla, ids, cascada});
      ev.target.disabled = false; ev.target.textContent = `Borrar ${ids.length}`;

      if(!r.ok){ recado('#recadoBorrado', r.error); return; }

      if(!r.fallos.length){
        cerrarVentana();
        await cargarLookups();
        irA(tabla);
        return;
      }

      // Algunos no se pudieron: se explica cuáles y por qué
      const mapa = new Map(ids.map((id,i) => [id, etiquetas[i]]));
      $('#ventanaCuerpo').innerHTML = `
        ${r.borrados ? `<div class="recado bien" style="margin-top:0">
          Se borraron ${r.borrados}.</div>` : ''}
        <div class="recado ojo" style="margin-top:12px">
          ${r.fallos.length} no se pudieron borrar:
        </div>
        <div class="tabla-marco" style="margin-top:12px"><table class="datos" style="min-width:0">
          <thead><tr><th>Registro</th><th>Motivo</th></tr></thead>
          <tbody>${r.fallos.map(f => `<tr>
            <td>${escapar(mapa.get(f.id) ?? f.id)}</td>
            <td style="color:var(--texto-suave);font-size:12.5px">${escapar(f.motivo)}</td>
          </tr>`).join('')}</tbody>
        </table></div>
        <p class="aviso-nota">Si querías borrarlas de todos modos, vuelve a intentarlo
        marcando «Borrar también lo que depende de estos registros».</p>`;
      $('#ventanaPie').innerHTML = '';
      const b = document.createElement('button');
      b.className = 'boton'; b.textContent = 'Entendido';
      b.addEventListener('click', () => { cerrarVentana(); irA(tabla); });
      $('#ventanaPie').appendChild(b);
    }
  });
}

function formAlumno(fila){
  const esNuevo = !fila;
  const cuerpo = `<div class="rejilla-campos">
      ${CAMPOS_ALUMNO.map(c => campoHTML(c, fila ? fila[c.c] : (c.tipo==='bool' ? true : ''))).join('')}
    </div><div id="recadoForm"></div>
    ${esNuevo ? '<p class="aviso-nota">El alumno entrará por primera vez con su matrícula y su CURP, y el sistema le pedirá crear una contraseña.</p>' : ''}`;

  abrirVentana(esNuevo ? 'Agregar alumno' : 'Editar alumno', cuerpo,
    [{texto:'Cancelar', clase:'tenue', accion:cerrarVentana},
     {texto:'Guardar', accion: async ev => {
       const registro = {};
       for(const c of CAMPOS_ALUMNO){
         const el = document.getElementById('f_' + c.c);
         let v = el.value;
         if(c.tipo==='bool') v = (v==='true');
         else if(v==='') v = null;
         else if(c.tipo==='numero' || c.tipo==='ref') v = Number(v);
         else if(c.c==='matricula' || c.c==='curp') v = String(v).trim().toUpperCase();
         if(c.req && !v){ recado('#recadoForm', `Falta capturar: ${c.r}`); return; }
         registro[c.c] = v;
       }
       if(registro.curp && registro.curp.length !== 18){
         recado('#recadoForm','La CURP debe tener exactamente 18 caracteres.'); return;
       }
       ev.target.disabled = true; ev.target.textContent='Guardando…';
       const res = esNuevo
         ? await api('crear', {tabla:'alumnos', registro})
         : await api('actualizar', {tabla:'alumnos', id:fila.id, cambios:registro});
       ev.target.disabled = false; ev.target.textContent='Guardar';
       if(!res.ok){ recado('#recadoForm', res.error); return; }
       cerrarVentana(); irA('alumnos');
     }}]);
}

      domicilio, colonia, codigo_postal, localidad, escuela_procedencia, promedio_secundaria</code></p>

    <div class="campo" style="margin-top:16px">
      <label for="impGrupo">Asignar todos al grupo</label>
      <select id="impGrupo"><option value="">Sin grupo</option>
        ${(lookups.grupos||[]).map(g => `<option value="${g.id}">${escapar(nombreGrupo(g))}</option>`).join('')}
      </select>
    </div>
    <div class="campo">
      <label for="impTexto">Pega aquí las filas</label>
      <textarea id="impTexto" style="min-height:180px;font-family:ui-monospace,monospace;font-size:12.5px"
        placeholder="matricula	curp	nombres	apellido_paterno	apellido_materno"></textarea>
      <p class="pista">Funciona con tabuladores (pegado desde Excel), comas o punto y coma.</p>
    </div>
    <div id="recadoImp"></div>`,
    [{texto:'Cancelar', clase:'tenue', accion:cerrarVentana},
     {texto:'Importar', accion: async ev => {
        const texto = $('#impTexto').value.trim();
        if(!texto){ recado('#recadoImp','Pega primero las filas.'); return; }

        const lineas = texto.split(/\r?\n/).filter(l => l.trim());
        const sep = lineas[0].includes('\t') ? '\t' : (lineas[0].includes(';') ? ';' : ',');
        const cols = lineas[0].split(sep).map(c => c.trim().toLowerCase());

        if(!cols.includes('matricula') || !cols.includes('curp')){
          recado('#recadoImp','La primera fila debe traer al menos las columnas matricula y curp.'); return;
        }

        const grupoId = $('#impGrupo').value ? Number($('#impGrupo').value) : null;
        const carreraId = grupoId ? (buscaEn('grupos', grupoId)?.carrera_id ?? null) : null;

        const filas = lineas.slice(1).map(l => {
          const v = l.split(sep);
          const o = {};
          cols.forEach((c,i) => { const val = (v[i] ?? '').trim(); if(val) o[c] = val; });
          if(grupoId){ o.grupo_id = grupoId; if(carreraId) o.carrera_id = carreraId; }
          if(o.promedio_secundaria) o.promedio_secundaria = Number(String(o.promedio_secundaria).replace(',','.'));
          return o;
        });

        ev.target.disabled = true; ev.target.textContent='Importando…';
        const res = await api('importar_alumnos', {filas});
        ev.target.disabled = false; ev.target.textContent='Importar';

        if(!res.ok){
          recado('#recadoImp', (res.error||'') + (res.errores?.length ? '\n' + res.errores.join('\n') : ''));
          return;
        }
        recado('#recadoImp',
          `Se importaron ${res.importados} alumnos.` +
          (res.omitidos ? ` Se omitieron ${res.omitidos}: ${res.errores.join(' · ')}` : ''),
          res.omitidos ? 'ojo' : 'bien');
        setTimeout(() => { cerrarVentana(); irA('alumnos'); }, res.omitidos ? 4000 : 1400);
     }}]);
}

async function verMaterias(){
  const r = await api('listar', {tabla:'materias', orden:'semestre', limite:2000});
  if(!r.ok) throw new Error(r.error);

  const asig = await api('listar', {tabla:'grupo_materia', limite:2000});
  const porMateria = {};
  (asig.ok ? asig.datos : []).forEach(a => {
    (porMateria[a.materia_id] = porMateria[a.materia_id] || []).push(a.grupo_id);
  });

  // Se juntan las versiones de la misma materia
  const grupos = new Map();
  r.datos.forEach(m => {
    const llave = `${m.semestre}|${normTxt(m.nombre)}`;
    if(!grupos.has(llave)){
      grupos.set(llave, {semestre:m.semestre, nombre:m.nombre, ids:[], carreras:[], grupos:new Set()});
    }
    const g = grupos.get(llave);
    g.ids.push(m.id);
    if(m.carrera_id) g.carreras.push(etiquetaRef('carreras', m.carrera_id));
    (porMateria[m.id] || []).forEach(x => g.grupos.add(x));
  });

  const lista = [...grupos.values()].sort((a,b) =>
    (a.semestre - b.semestre) || cmp(a.nombre, b.nombre));

  $('#vista').innerHTML = `
    <div class="tarjeta">
      <h3>Materias <span style="font-weight:400;color:var(--texto-suave)">(${lista.length})</span>
        <span class="der">
          <button class="boton peligro chico oculto" id="btnBorrarSel">Borrar seleccionadas</button>
          <button class="boton tenue chico" id="btnExpMat">Exportar a Excel</button>
        </span></h3>
      ${lista.length ? `
        <div class="tabla-marco"><table class="datos">
          <thead><tr><th style="width:40px"><input type="checkbox" id="chkTodos"></th>
            <th class="n">Sem.</th><th>Materia</th><th>Grupos</th><th></th></tr></thead>
          <tbody>${lista.map((m,i) => `<tr data-i="${i}">
            <td><input type="checkbox" class="chkFila" value="${i}"></td>
            <td class="n">${m.semestre}</td>
            <td><b>${escapar(m.nombre)}</b>
              ${m.carreras.length ? `<div style="color:var(--texto-suave);font-size:12px;margin-top:3px">${
                escapar([...new Set(m.carreras)].join(' · '))}</div>` : ''}</td>
            <td>${[...m.grupos].map(id => escapar(etiquetaRef('grupos', id)))
                  .sort().map(g => `<span class="sello info" style="margin:1px">${g}</span>`).join(' ')
                 || '<span style="color:var(--texto-suave);font-size:12.5px">sin asignar</span>'}</td>
            <td class="acciones">
              <button class="boton tenue chico renombrar">Renombrar</button>
              <button class="boton tenue chico borrar">Borrar</button>
            </td></tr>`).join('')}</tbody>
        </table></div>`
        : '<div class="vacio"><div class="g">▩</div><p>No hay materias. Importa el Excel de calificaciones.</p></div>'}
    </div>
    <p class="aviso-nota">Las materias se crean solas al importar el Excel. Al renombrar
    o borrar, la acción aplica a todas las especialidades que comparten ese nombre.</p>`;

  $('#btnExpMat').addEventListener('click', () => exportarCSV('materias', lista.map(m => ({
    semestre: m.semestre, materia: m.nombre,
    carreras: [...new Set(m.carreras)].join(' · '),

  const refrescar = () => {
    const n = $$('.chkFila').filter(c => c.checked).length;

    b.textContent = `Borrar ${n} materia${n === 1 ? '' : 's'}`;

  $('#chkTodos').addEventListener('change', e => {
    $$('.chkFila').forEach(c => c.checked = e.target.checked); refrescar();
  });
  $('#vista').addEventListener('change', e => {
    if(vistaActual !== 'materias') return;
    if(e.target.classList.contains('chkFila')) refrescar();
  });

  $('#btnBorrarSel').addEventListener('click', () => {
    const sel = $$('.chkFila').filter(c => c.checked).map(c => lista[Number(c.value)]);
    borrarDeCatalogo('materias', sel.flatMap(m => m.ids),
      sel.flatMap(m => m.ids.map(() => `${m.semestre}° ${m.nombre}`)), 'materia');
  });

  $('#vista').addEventListener('click', async e => {
    if(vistaActual !== 'materias') return;
    const tr = e.target.closest('tr[data-i]'); if(!tr) return;
    const m = lista[Number(tr.dataset.i)];

    if(e.target.classList.contains('borrar')){
      borrarDeCatalogo('materias', m.ids,
        m.ids.map(() => `${m.semestre}° ${m.nombre}`), 'materia');
    }

    if(e.target.classList.contains('renombrar')){
      abrirVentana('Renombrar materia', `
        <p style="font-size:13.5px;color:var(--texto-suave);margin-bottom:14px">

                           ev.target.textContent = 'Guardar'; return; }
            }
            cerrarVentana(); await cargarLookups(); irA('materias');
         }}]);
    }
  });
}

function formAsignacion(fila){
  const esNuevo = !fila;
  const campos = [
    {c:'grupo_id', r:'Grupo', tipo:'ref', tabla:'grupos', req:true},
    {c:'materia_id', r:'Materia', tipo:'ref', tabla:'materias', req:true},
    {c:'docente_id', r:'Docente', tipo:'ref', tabla:'docentes', vacio:'Por asignar'}
  ];
  abrirVentana(esNuevo ? 'Asignar materia' : 'Cambiar docente',
    `<div class="rejilla-campos">${campos.map(c => campoHTML(c, fila ? fila[c.c] : '')).join('')}</div><div id="recadoForm"></div>`,
    [{texto:'Cancelar', clase:'tenue', accion:cerrarVentana},
     {texto:'Guardar', accion: async ev => {
       const registro = {};
       for(const c of campos){
         const v = document.getElementById('f_'+c.c).value;
         if(c.req && !v){ recado('#recadoForm',`Falta: ${c.r}`); return; }
         registro[c.c] = v ? Number(v) : null;
       }
       ev.target.disabled = true;
       const res = esNuevo
         ? await api('crear', {tabla:'grupo_materia', registro})
         : await api('actualizar', {tabla:'grupo_materia', id:fila.id, cambios:{docente_id:registro.docente_id}});
       ev.target.disabled = false;
       if(!res.ok){ recado('#recadoForm', res.error); return; }
       cerrarVentana(); irA('asignaciones');
     }}]);
}

/* ==========================================================================
   HORARIOS  ·  una imagen por grupo

   La imagen se reduce y se convierte a JPEG en el navegador antes de subirla,
   para que no pese de más. Se guarda en la base de datos, no en un enlace
   público: solo la ve el alumno del grupo al que pertenece.
   ========================================================================== */

const ANCHO_MAX = 1600;
const PESO_OBJETIVO = 900 * 1024;   // ~900 KB en base64

function comprimirImagen(archivo){
  return new Promise((resolver, rechazar) => {
    const lector = new FileReader();
    lector.onload = () => {
      const img = new Image();
      img.onload = () => {
        const escala = Math.min(1, ANCHO_MAX / img.width);
        const lienzo = document.createElement('canvas');
        lienzo.width = Math.round(img.width * escala);
        lienzo.height = Math.round(img.height * escala);
        const ctx = lienzo.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, lienzo.width, lienzo.height);
        ctx.drawImage(img, 0, 0, lienzo.width, lienzo.height);

        let calidad = 0.85, salida = lienzo.toDataURL('image/jpeg', calidad);
        while(salida.length > PESO_OBJETIVO && calidad > 0.4){
          calidad -= 0.1;
          salida = lienzo.toDataURL('image/jpeg', calidad);
        }
        resolver({ dataUrl: salida, ancho: lienzo.width, alto: lienzo.height });
      };
      img.onerror = () => rechazar(new Error('El archivo no es una imagen válida.'));
      img.src = lector.result;
    };
    lector.onerror = () => rechazar(new Error('No se pudo abrir el archivo.'));
    lector.readAsDataURL(archivo);
  });
}

                     ${c.peso_kb} KB · actualizado el ${fecha(String(c.actualizado_en).slice(0,10))}
                   </p>` : ''}
            <input type="file" accept="image/*" class="archivoH" style="width:100%;font-size:13px">
            <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
              ${c ? '<button class="boton tenue chico verH">Ver</button>' : ''}
              ${c ? '<button class="boton tenue chico borrarH">Quitar</button>' : ''}
            </div>
            <div class="recadoH"></div>
          </div>
        </div>`;
      }).join('')}
    </div>`;

  $('#vista').addEventListener('change', async e => {
    if(vistaActual !== 'horarios') return;
    if(!e.target.classList.contains('archivoH')) return;
    const archivo = e.target.files[0];
    if(!archivo) return;
    const caja = e.target.closest('[data-grupo]');
    const grupoId = Number(caja.dataset.grupo);
    const aviso = caja.querySelector('.recadoH');

    aviso.innerHTML = '<div class="recado ojo">Preparando la imagen…</div>';
    try {
      const { dataUrl, ancho, alto } = await comprimirImagen(archivo);
      caja.querySelector('.vistaPrevia').innerHTML =
        `<img src="${dataUrl}" style="width:100%;border:1px solid var(--linea);border-radius:8px">`;

      aviso.innerHTML = '<div class="recado ojo">Guardando…</div>';
      const res = await api('guardar_horario_imagen', {
        grupo_id: grupoId, imagen: dataUrl,
        tipo: 'image/jpeg', nombre_archivo: archivo.name
      });

      aviso.innerHTML = res.ok
        ? `<div class="recado bien">Horario guardado · ${res.peso_kb} KB · ${ancho}×${alto} px</div>`
        : `<div class="recado mal">${escapar(res.error)}</div>`;
      if(res.ok) setTimeout(() => irA('horarios'), 1200);
    } catch(err){
      aviso.innerHTML = `<div class="recado mal">${escapar(err.message)}</div>`;
    }
  });

  $('#vista').addEventListener('click', async e => {
    if(vistaActual !== 'horarios') return;
    const caja = e.target.closest('[data-grupo]');
    if(!caja) return;
    const grupoId = Number(caja.dataset.grupo);

    if(e.target.classList.contains('verH')){
      const res = await api('horario_imagen', { grupo_id: grupoId });
      if(!res.ok || !res.horario){ alert('No se pudo cargar la imagen.'); return; }
      abrirVentana('Horario del grupo',
        `<img src="${res.horario.imagen}" style="width:100%;border-radius:8px">`,
        [{texto:'Cerrar', clase:'tenue', accion:cerrarVentana}]);
      // La ventana crece con la imagen; no se abre pestaña nueva porque los
      // navegadores bloquean las URL "data:" en navegación de primer nivel.
    }

    if(e.target.classList.contains('borrarH')){
      if(!confirm('¿Quitar el horario de este grupo? Los alumnos dejarán de verlo.')) return;
      const res = await api('borrar_horario_imagen', { grupo_id: grupoId });
      if(!res.ok){ alert(res.error); return; }
      irA('horarios');
    }
  });
}

/* ==========================================================================
   DOCUMENTOS  ·  bandeja de revisión

   Los alumnos suben sus documentos desde su portal. Aquí solo se revisan:
   se aceptan o se devuelven con una observación. Al devolver uno, el archivo
   se borra para que el alumno suba otro y no se acumule espacio.
   ========================================================================== */

async function verDocumentos(){
  const [bandeja, listado] = await Promise.all([
    api('bandeja_documentos'),
    api('listar', {
      tabla:'alumnos', columnas:'id,matricula,nombres,apellido_paterno,apellido_materno,grupo_id',
      orden:'apellido_paterno', limite:1000 })
  ]);
  if(!bandeja.ok) throw new Error(bandeja.error);

  const alumnos = ordenar('alumnos', listado.ok ? listado.datos : []);
  const d = await api('listar', {
    tabla:'alumno_documentos',
    columnas:'id,alumno_id,documento_id,estado,observaciones', limite:5000 });
  const entregas = d.ok ? d.datos : [];
  const cat = (lookups.documentos_catalogo||[]).filter(x => x.activo).sort((a,b) => a.orden-b.orden);

  const esp = bandeja.espacio || {};
  const mb = Number(esp.total_mb || 0);
  // Los documentos viven en Supabase Storage, que da 1 GB aparte de los
  // 500 MB de la base de datos.
  const LIMITE_MB = 1024;
  const porc = Math.min(100, Math.round(mb / LIMITE_MB * 100));

  const nombreAl = a => `${a.apellido_paterno} ${a.apellido_materno ?? ''} ${a.nombres}`.trim();

  $('#vista').innerHTML = `
    <div class="medidores">
      <div class="medidor ${esp.por_revisar ? 'alerta':'bien'}">
        <div class="r">Por revisar</div><div class="v">${esp.por_revisar ?? 0}</div></div>
      <div class="medidor bien"><div class="r">Aceptados</div><div class="v">${esp.aceptados ?? 0}</div></div>
      <div class="medidor"><div class="r">Con observaciones</div><div class="v">${esp.con_observaciones ?? 0}</div></div>
      <div class="medidor ${porc > 70 ? 'alerta':''}">
        <div class="r">Espacio en Storage</div><div class="v">${mb} MB</div>
        <div class="n">${porc}% de 1 GB · promedio ${esp.promedio_kb ?? 0} KB</div></div>
    </div>

    ${porc > 70 ? `<div class="recado ojo" style="margin-top:16px">
      Los documentos ya ocupan ${mb} MB del 1 GB disponible en Storage. Archiva las
      generaciones que hayan egresado desde «Cierre de ciclo» para liberar espacio.</div>` : ''}

    <div class="tarjeta" style="margin-top:20px">
      <h3>Documentos por revisar
        <span style="font-weight:400;color:var(--texto-suave)">(${bandeja.pendientes.length})</span></h3>
      ${bandeja.pendientes.length ? `
        <div class="tabla-marco"><table class="datos">
          <thead><tr><th>Alumno</th><th>Grupo</th><th>Documento</th><th>Subido</th><th></th></tr></thead>
          <tbody>${bandeja.pendientes.map(x => `<tr data-reg="${x.id}">
            <td><b>${escapar(nombreAl(x.alumnos || {}))}</b>
              <div style="color:var(--texto-suave);font-size:12px">${escapar(x.alumnos?.matricula ?? '')}</div></td>
            <td>${escapar(x.alumnos?.grupos ? nombreGrupo(x.alumnos.grupos) : '—')}</td>
            <td>${escapar(x.documentos_catalogo?.nombre ?? '')}</td>
            <td style="white-space:nowrap">${x.subido_en ? fecha(String(x.subido_en).slice(0,10)) : '—'}
              <div style="color:var(--texto-suave);font-size:12px">${x.peso_kb ?? '?'} KB</div></td>
            <td class="acciones"><button class="boton chico revisar">Revisar</button></td>
          </tr>`).join('')}</tbody>
        </table></div>`
        : '<div class="vacio"><div class="g">▧</div><p>No hay documentos esperando revisión.</p></div>'}
    </div>

    <div class="tarjeta" style="margin-top:20px">
      <h3>Expedientes
        <span style="font-weight:400;color:var(--texto-suave)">(${alumnos.length} alumnos)</span>
        <span class="der"><button class="boton tenue chico" id="btnExpDocs">Exportar a Excel</button></span></h3>
      ${alumnos.length ? `
        <div class="tabla-marco"><table class="datos">
          <thead><tr><th>Alumno</th><th>Grupo</th>
            ${cat.map(c => `<th class="n" title="${escapar(c.nombre)}">${escapar(c.nombre.split(' ')[0])}</th>`).join('')}
            <th class="n">Faltan</th></tr></thead>
          <tbody>${alumnos.map(a => {
            const mios = entregas.filter(x => x.alumno_id === a.id);
            let faltan = 0;
            const celdas = cat.map(c => {
              const e = mios.find(x => x.documento_id === c.id);
              const est = e?.estado ?? 'PENDIENTE';
              if(!['ENTREGADO','NO_APLICA'].includes(est) && c.obligatorio) faltan++;
              const marca = est === 'ENTREGADO' ? '<span class="sello va">✓</span>'
                          : est === 'EN_REVISION' ? '<span class="sello info">…</span>'
                          : est === 'OBSERVACIONES' ? '<span class="sello ojo">!</span>'
                          : '<span class="sello cae">·</span>';
              return `<td class="n">${marca}</td>`;
            }).join('');
            return `<tr data-id="${a.id}" style="cursor:pointer">
              <td><b>${escapar(nombreAl(a))}</b>
                <div style="color:var(--texto-suave);font-size:12px">${escapar(a.matricula)}</div></td>
              <td>${escapar(etiquetaRef('grupos', a.grupo_id))}</td>
              ${celdas}
              <td class="n">${faltan ? `<span class="sello cae">${faltan}</span>` : '<span class="sello va">0</span>'}</td>
            </tr>`;
          }).join('')}</tbody>
        </table></div>`
        : '<div class="vacio"><div class="g">▧</div><p>No hay alumnos registrados.</p></div>'}
    </div>`;

  $('#btnExpDocs').addEventListener('click', () => exportarCSV('expedientes', alumnos.map(a => {
    const mios = entregas.filter(x => x.alumno_id === a.id);
    const o = {matricula:a.matricula, alumno:nombreAl(a), grupo: etiquetaRef('grupos', a.grupo_id)};
    cat.forEach(c => { o[c.nombre] = mios.find(x => x.documento_id === c.id)?.estado ?? 'PENDIENTE'; });
    return o;
  })));

  $('#vista').addEventListener('click', async e => {
    if(vistaActual !== 'documentos') return;
    if(e.target.classList.contains('revisar')){
      const regId = Number(e.target.closest('tr[data-reg]').dataset.reg);
      revisarDocumento(regId);
      return;
    }
    const tr = e.target.closest('tr[data-id]');
    if(tr) verFicha(Number(tr.dataset.id));
  });
}

async function revisarDocumento(regId, alCerrar){
  abrirVentana('Revisar documento', '<div class="cargando">Cargando…</div>', []);
  const r = await api('ver_documento_alumno', {registro_id: regId});
  if(!r.ok || !r.documento){
    $('#ventanaCuerpo').innerHTML = '<div class="recado mal">No se pudo abrir el archivo.</div>';
    return;
  }
  const doc = r.documento;
  const nombre = String(doc.nombre_archivo || '').toLowerCase();
  // El nombre original manda: el enlace firmado no siempre trae extensión
  const esPDF = nombre.endsWith('.pdf') || /\.pdf(\?|$)/.test(String(doc.url || ''));
  const fuente = doc.url || '';

  $('#ventanaCuerpo').innerHTML = `
    ${esPDF
      ? `<div class="recado ojo">El alumno subió un PDF. Ábrelo para revisarlo.</div>
         <button class="boton tenue" id="abrirPDF" style="margin-top:12px">Abrir el PDF</button>`
      : `<img src="${fuente}" style="width:100%;border-radius:8px;border:1px solid var(--linea)">`}
    <div class="campo" style="margin-top:16px">
      <label for="revObs">Observaciones para el alumno</label>
      <textarea id="revObs" placeholder="Ej. La foto salió borrosa, vuelve a tomarla con más luz.">${escapar(doc.observaciones ?? '')}</textarea>
      <p class="pista">Solo se envían si devuelves el documento.</p>
    </div>
    <div id="recadoRev"></div>`;

  const pdfBtn = $('#abrirPDF');
  if(pdfBtn) pdfBtn.addEventListener('click', () => {
    window.open(doc.url, '_blank', 'noopener');
  });

  const decidir = async (estado, ev) => {
    ev.target.disabled = true;
    const res = await api('revisar_documento', {
      registro_id: regId, estado,
      observaciones: estado === 'OBSERVACIONES' ? $('#revObs').value.trim() : null
    });
    ev.target.disabled = false;
    if(!res.ok){ recado('#recadoRev', res.error); return; }
    cerrarVentana();
    irA(vistaActual === 'documentos' ? 'documentos' : vistaActual);
  };

  $('#ventanaPie').innerHTML = '';
  [
    {texto:'Cancelar', clase:'tenue', accion: () => { if(alCerrar) alCerrar(); else cerrarVentana(); }},
    {texto:'Devolver al alumno', clase:'peligro', accion: ev => {
      if(!$('#revObs').value.trim()){
        recado('#recadoRev','Escribe qué debe corregir el alumno.'); return;
      }
      decidir('OBSERVACIONES', ev);
    }},
    {texto:'Aceptar documento', accion: ev => decidir('ENTREGADO', ev)}
  ].forEach(b => {
    const el = document.createElement('button');
    el.className = 'boton ' + (b.clase || '');
    el.textContent = b.texto;
    el.addEventListener('click', b.accion);
    $('#ventanaPie').appendChild(el);
  });
}

/* ==========================================================================
   REPORTES
   Los captura el administrador. El alumno los ve en su portal, salvo los
   marcados como no visibles, que quedan como nota interna.
   ========================================================================== */

const TIPOS_REPORTE = ['ACADEMICO','CONDUCTA','ASISTENCIA','RECONOCIMIENTO','CITATORIO','OTRO'];
const ETIQ_REPORTE = {
  ACADEMICO:'Académico', CONDUCTA:'Conducta', ASISTENCIA:'Asistencia',
  RECONOCIMIENTO:'Reconocimiento', CITATORIO:'Citatorio', OTRO:'Otro'
};
const COLOR_REPORTE = {
  ACADEMICO:'ojo', CONDUCTA:'cae', ASISTENCIA:'ojo',
  RECONOCIMIENTO:'va', CITATORIO:'cae', OTRO:'info'
};

let filtroReportes = {grupo_id:'', tipo:''};

async function verReportes(){
  const filtros = {};
  if(filtroReportes.grupo_id) filtros.grupo_id = Number(filtroReportes.grupo_id);
  if(filtroReportes.tipo) filtros.tipo = filtroReportes.tipo;

  const r = await api('listar', {tabla:'v_reportes', filtros,
                                 orden:'fecha', ascendente:false, limite:800});
  if(!r.ok) throw new Error(r.error);
  const lista = r.datos;

  $('#vista').innerHTML = `
    <div class="herramientas">
      <div class="campo">
        <label for="rGrupo">Grupo</label>
        <select id="rGrupo"><option value="">Todos</option>
          ${(lookups.grupos||[]).map(g => `<option value="${g.id}"${
            String(filtroReportes.grupo_id)===String(g.id)?' selected':''
          }>${escapar(nombreGrupo(g))}</option>`).join('')}
        </select>
      </div>
      <div class="campo">
        <label for="rTipo">Tipo</label>
        <select id="rTipo"><option value="">Todos</option>
          ${TIPOS_REPORTE.map(t => `<option value="${t}"${
            filtroReportes.tipo===t?' selected':''}>${ETIQ_REPORTE[t]}</option>`).join('')}
        </select>
      </div>
      <button class="boton tenue" id="btnExpRep">Exportar a Excel</button>
      <button class="boton" id="btnNuevoRep">Levantar reporte</button>
    </div>

    <div class="tarjeta">
      <h3>Reportes <span style="font-weight:400;color:var(--texto-suave)">(${lista.length})</span></h3>
      ${lista.length ? `
        <div class="tabla-marco"><table class="datos">
          <thead><tr><th>Fecha</th><th>Alumno</th><th>Grupo</th><th>Tipo</th>
            <th>Motivo</th><th>Estado</th><th></th></tr></thead>
          <tbody>${lista.map(x => `<tr data-rep="${x.id}">
            <td style="white-space:nowrap">${fecha(x.fecha)}</td>
            <td><b>${escapar(x.alumno)}</b>
              <div style="color:var(--texto-suave);font-size:12px">${escapar(x.matricula)}</div></td>
            <td>${escapar(x.grupo ?? '—')}</td>
            <td><span class="sello ${COLOR_REPORTE[x.tipo]||'info'}">${ETIQ_REPORTE[x.tipo]||x.tipo}</span></td>
            <td>${escapar(x.motivo)}
              ${x.requiere_tutor ? '<div style="font-size:12px;color:var(--rojo);margin-top:2px">Requiere al tutor</div>' : ''}</td>
            <td>${x.atendido ? '<span class="sello va">Atendido</span>' : '<span class="sello ojo">Abierto</span>'}
              ${x.visible_alumno ? '' : '<div style="font-size:11.5px;color:var(--texto-suave);margin-top:2px">Nota interna</div>'}</td>
            <td class="acciones">
              <button class="boton tenue chico editarRep">Editar</button>
              <button class="boton tenue chico borrarRep">Borrar</button>
            </td></tr>`).join('')}</tbody>
        </table></div>`
        : '<div class="vacio"><div class="g">✦</div><p>No hay reportes con esos criterios.</p></div>'}
    </div>`;

  $('#rGrupo').addEventListener('change', e => { filtroReportes.grupo_id = e.target.value; irA('reportes'); });
  $('#rTipo').addEventListener('change', e => { filtroReportes.tipo = e.target.value; irA('reportes'); });
  $('#btnNuevoRep').addEventListener('click', () => formReporte(null));
  $('#btnExpRep').addEventListener('click', () => exportarCSV('reportes', lista,
    ['fecha','matricula','alumno','grupo','tipo','motivo','descripcion','medida',
     'docente','materia','requiere_tutor','atendido','visible_alumno']));

  $('#vista').addEventListener('click', async e => {
    if(vistaActual !== 'reportes') return;
    const tr = e.target.closest('tr[data-rep]'); if(!tr) return;
    const id = Number(tr.dataset.rep);

    if(e.target.classList.contains('editarRep')){
      const f = await api('listar', {tabla:'reportes', filtros:{id}, limite:1});
      if(f.ok && f.datos[0]) formReporte(f.datos[0]);
    }
    if(e.target.classList.contains('borrarRep')){
      if(!confirm('¿Borrar este reporte? El alumno dejará de verlo.')) return;
      const res = await api('eliminar', {tabla:'reportes', id});
      if(!res.ok){ alert(res.error); return; }
      irA('reportes');
    }
  });
}

async function formReporte(fila){
  const esNuevo = !fila;

  // Alumnos para elegir, filtrados por grupo para que la lista sea manejable
  const res = await api('listar', {
    tabla:'alumnos',
    columnas:'id,matricula,nombres,apellido_paterno,apellido_materno,grupo_id',
    orden:'apellido_paterno', limite:1000});
  const alumnos = ordenar('alumnos', res.ok ? res.datos : []);

  const opcAlumno = a => `<option value="${a.id}"${fila?.alumno_id === a.id ? ' selected':''}>${
    escapar(`${a.apellido_paterno} ${a.apellido_materno ?? ''} ${a.nombres}`.trim())
  } · ${escapar(etiquetaRef('grupos', a.grupo_id))}</option>`;

  abrirVentana(esNuevo ? 'Levantar reporte' : 'Editar reporte', `
    <div class="rejilla-campos">
      <div class="campo completo">
        <label for="rpAlumno">Alumno *</label>
        <select id="rpAlumno"><option value="">— elegir —</option>

      <div class="campo">

        <select id="rpTipo">${TIPOS_REPORTE.map(t =>
          `<option value="${t}"${fila?.tipo===t?' selected':''}>${ETIQ_REPORTE[t]}</option>`).join('')}</select>
      </div>
      <div class="campo">
        <label for="rpFecha">Fecha *</label>
        <input id="rpFecha" type="date" value="${escapar(fila?.fecha ?? new Date().toISOString().slice(0,10))}">
      </div>
      <div class="campo completo">
        <label for="rpMotivo">Motivo *</label>
        <input id="rpMotivo" value="${escapar(fila?.motivo ?? '')}"
               placeholder="Ej. Tres retardos consecutivos en la semana">
      </div>
      <div class="campo completo">
        <label for="rpDescripcion">Descripción</label>
        <textarea id="rpDescripcion" placeholder="Qué pasó, con detalle.">${escapar(fila?.descripcion ?? '')}</textarea>
      </div>
      <div class="campo completo">
        <label for="rpMedida">Qué sigue</label>
        <textarea id="rpMedida" placeholder="Acuerdo, compromiso o medida tomada.">${escapar(fila?.medida ?? '')}</textarea>
      </div>
      <div class="campo">
        <label for="rpDocente">Docente</label>
        <select id="rpDocente"><option value="">— ninguno —</option>
          ${(lookups.docentes||[]).map(d => `<option value="${d.id}"${
            fila?.docente_id===d.id?' selected':''}>${escapar(d.nombre_completo)}</option>`).join('')}</select>
      </div>
      <div class="campo">
        <label for="rpMateria">Asignatura</label>
        <select id="rpMateria"><option value="">— ninguna —</option>
          ${(lookups.materias||[]).map(m => `<option value="${m.id}"${
            fila?.materia_id===m.id?' selected':''}>${escapar(m.nombre)}</option>`).join('')}</select>
      </div>
      <div class="campo">
        <label for="rpTutor">¿Requiere presencia del tutor?</label>
        <select id="rpTutor">
          <option value="false"${!fila?.requiere_tutor?' selected':''}>No</option>
          <option value="true"${fila?.requiere_tutor?' selected':''}>Sí</option></select>
      </div>
      <div class="campo">
        <label for="rpAtendido">¿Ya se atendió?</label>
        <select id="rpAtendido">
          <option value="false"${!fila?.atendido?' selected':''}>No, sigue abierto</option>
          <option value="true"${fila?.atendido?' selected':''}>Sí, atendido</option></select>
      </div>
      <div class="campo completo">
        <label for="rpVisible">¿El alumno lo puede ver?</label>

         : await api('actualizar', {tabla:'reportes', id:fila.id, cambios:registro});
       ev.target.disabled = false; ev.target.textContent = 'Guardar';

       if(!r.ok){ recado('#recadoRep', r.error); return; }
       cerrarVentana(); irA('reportes');
     }}]);
}

/* ==========================================================================
   IMPORTAR EXCEL

   El archivo que exporta el sistema de la SEP se llama .xls pero por dentro
   es una tabla HTML con codificación mezclada: latin-1 en su mayoría, pero
   con algunos textos en UTF-8 (las eñes). Por eso se decodifica byte por
   byte y se interpreta con DOMParser, no con una librería de Excel.
   ========================================================================== */

const COLUMNAS_EXCEL = {
  'CARRERA':'carrera', 'GENERACION':'generacion', 'TURNO':'turno',
  'SEMESTRE':'semestre', 'GRUPO':'grupo', 'NO CONTROL':'no_control',
  'NOMBRE':'nombres', 'PATERNO':'paterno', 'MATERNO':'materno', 'CURP':'curp',
  'NOMBRE ASIGNATURA':'asignatura', 'NOMBRE DOCENTE':'docente',
  'RFC DOCENTE':'rfc_docente',
  'PERIODO 1':'p1', 'PERIODO 2':'p2', 'PERIODO 3':'p3',
  'CALIFICACION':'calificacion', 'PERIODO':'periodo'
};

const OBLIGATORIAS = ['CARRERA','SEMESTRE','GRUPO','NO CONTROL','NOMBRE',
                      'PATERNO','CURP','NOMBRE ASIGNATURA','PERIODO'];

let filasLeidas = null, nombreArchivo = '';

const CP1252_ALTO = {
  0x80:'€',0x82:'‚',0x83:'ƒ',0x84:'„',0x85:'…',0x86:'†',0x87:'‡',0x88:'ˆ',
  0x89:'‰',0x8A:'Š',0x8B:'‹',0x8C:'Œ',0x8E:'Ž',0x91:'\u2018',0x92:'\u2019',
  0x93:'“',0x94:'”',0x95:'•',0x96:'–',0x97:'—',0x98:'˜',0x99:'™',0x9A:'š',
  0x9B:'›',0x9C:'œ',0x9E:'ž',0x9F:'Ÿ'
};

function decodificarHibrido(buffer){
  const b = new Uint8Array(buffer);
  const utf8 = new TextDecoder('utf-8', {fatal:true});
  const partes = [];
  let i = 0;
  while(i < b.length){
    const c = b[i];
    if(c < 0x80){ partes.push(String.fromCharCode(c)); i++; continue; }
    const largo = c >= 0xF0 ? 4 : c >= 0xE0 ? 3 : c >= 0xC0 ? 2 : 0;
    let listo = false;
    if(largo && i + largo <= b.length){
      try { partes.push(utf8.decode(b.subarray(i, i + largo))); i += largo; listo = true; }
      catch(e){ /* no era UTF-8 válido */ }
    }
    if(!listo){ partes.push(CP1252_ALTO[c] ?? String.fromCharCode(c)); i++; }
  }
  return partes.join('');
}

/* Los .xlsx guardan el número de control y las calificaciones como números.
   Convertirlos con el formato de Excel los arruina: la matrícula
   24123012910001 se vuelve "2.4123E+13". Por eso se leen crudos y se
   convierten aquí, donde sí se controla el resultado. */
function limpia(v){
  if(v === null || v === undefined) return '';
  if(typeof v === 'number'){
    if(Number.isInteger(v)) return String(v);
    return String(Number(v.toFixed(4)));   // 8.5 sigue siendo 8.5
  }
  if(typeof v === 'boolean') return v ? 'SI' : 'NO';
  return String(v).replace(/\u00a0/g,' ').replace(/\s+/g,' ').trim();
}
function normTxt(t){
  return limpia(t).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase();
}

/* El archivo puede llegar en tres formatos:
   - .xls de la SEP, que por dentro es una tabla HTML en codificación mezclada
   - .xlsx de verdad, si alguien lo abrió en Excel y lo volvió a guardar
   - .csv, si se exportó así
   Se detecta por el contenido, no por la extensión, porque el .xls de la SEP
   miente sobre lo que realmente es. */
function leerArchivo(e){
  const f = e.target.files[0];
  if(!f) return;
  nombreArchivo = f.name;
  recado('#recadoImp','Leyendo el archivo…','ojo');
  $('#previa').innerHTML = '';

  const lector = new FileReader();
  lector.onload = () => {
    try {
      const buffer = lector.result;
      const primeros = new Uint8Array(buffer.slice(0, 4));

      // Un .xlsx es un archivo comprimido: empieza con "PK"
      if(primeros[0] === 0x50 && primeros[1] === 0x4B){
        procesarXLSX(buffer);
        return;
      }

      const texto = decodificarHibrido(buffer);
      if(/<table/i.test(texto)) procesarTexto(texto);
      else procesarCSV(texto);
    } catch(err){
      recado('#recadoImp','No se pudo leer el archivo: ' + err.message);
    }
  };
  lector.onerror = () => recado('#recadoImp','No se pudo abrir el archivo.');
  lector.readAsArrayBuffer(f);
}

/* Excel real */
function procesarXLSX(buffer){
  if(typeof XLSX === 'undefined'){
    recado('#recadoImp','No se pudo cargar el lector de Excel. Revisa tu conexión y recarga la página.');
    return;
  }
  const libro = XLSX.read(new Uint8Array(buffer), {type:'array'});
  const hoja = libro.Sheets[libro.SheetNames[0]];
  if(!hoja) throw new Error('El archivo no tiene ninguna hoja.');

  // raw:true entrega los valores reales. Con raw:false, Excel devuelve los
  // números grandes en notación científica y la matrícula se corrompe.
  const matriz = XLSX.utils.sheet_to_json(hoja, {header:1, defval:'', raw:true, blankrows:false});
  armarFilas(matriz);
}

/* Texto separado por comas, punto y coma o tabuladores */
function procesarCSV(texto){
  const lineas = texto.split(/\r?\n/).filter(l => l.trim());
  if(lineas.length < 2) throw new Error('El archivo viene vacío.');

  const sep = lineas[0].includes('\t') ? '\t' : (lineas[0].includes(';') ? ';' : ',');
  const partir = linea => {
    const salida = []; let actual = '', entreComillas = false;
    for(let i = 0; i < linea.length; i++){
      const c = linea[i];
      if(c === '"'){
        if(entreComillas && linea[i+1] === '"'){ actual += '"'; i++; }
        else entreComillas = !entreComillas;
      } else if(c === sep && !entreComillas){ salida.push(actual); actual = ''; }
      else actual += c;
    }
    salida.push(actual);
    return salida;
  };
  armarFilas(lineas.map(partir));
}

/* Recibe una matriz (primer renglón = encabezados) y construye las filas */
function armarFilas(matriz){
  if(!matriz.length) throw new Error('El archivo viene vacío.');

  const encabezados = matriz[0].map(c => normTxt(c));
  const faltan = OBLIGATORIAS.filter(c => !encabezados.includes(c));
  if(faltan.length){
    recado('#recadoImp','Al archivo le faltan estas columnas: ' + faltan.join(', '));
    return;
  }

  const filas = [];
  for(let i = 1; i < matriz.length; i++){
    const celdas = matriz[i];
    if(!celdas || !celdas.length) continue;
    const o = {};
    encabezados.forEach((h, j) => {
      const campo = COLUMNAS_EXCEL[h];
      if(campo) o[campo] = limpia(celdas[j]);
    });
    if(o.no_control && o.asignatura) filas.push(o);
  }

  if(!filas.length){ recado('#recadoImp','No se encontró ninguna fila con datos.'); return; }

  filasLeidas = filas;
  recado('#recadoImp','');
  mostrarPrevia(filas);
}

/* Tabla HTML disfrazada de .xls, que es lo que exporta la SEP */
function procesarTexto(texto){
  const doc = new DOMParser().parseFromString(texto, 'text/html');
  const tabla = doc.querySelector('table');
  if(!tabla) throw new Error('El archivo no contiene una tabla.');

  const matriz = Array.from(tabla.querySelectorAll('tr'))
    .map(tr => Array.from(tr.querySelectorAll('th,td')).map(c => c.textContent));

  if(matriz.length < 2) throw new Error('La tabla viene vacía.');
  armarFilas(matriz);
}

// Misma regla que aplica la Edge Function
function letraDeGrupo(carrera, letraExcel){
  const c = normTxt(carrera);
  if(c.includes('AGROPECUARIO')) return 'A';
  if(c.includes('ADMINISTRACION')) return 'B';
  if(c.includes('SOPORTE')) return 'C';
  return (letraExcel || 'A').toUpperCase();
}

  $('#previa').innerHTML = `

        <div class="tabla-marco"><table class="datos" style="min-width:0">

        </table></div>
